    <article class="poem">
      <h2><a href="/poems/it-used-to-be-me.html">it used to be me</a></h2>
      <p>it used to be<br>it used to be me<br>writhing under you<br>or riding beside you</p>

    <h2>How today’s photograph and poem were chosen</h2>
    <p>A different photograph and a different poem every day, chosen for where I am and what the sky is doing.</p>
    <ol class="steps-plain">
      <li>Where I am</li>
      <li>The sky there</li>
      <li>What the day asks for, on seven measures: light, warmth, wet, calm, season, out of doors, mood</li>
      <li>The photograph nearest to it, of the ones not seen lately</li>
      <li>The poem nearest to it</li>
      <li>What runs behind it: the six ideas above</li>
    </ol>
