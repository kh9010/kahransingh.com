<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Study 24</title>
<meta name="description" content="The walk through the worlds: today's stone, pressing in, the poem arriving, a door line, the crossing through the gem, and on.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* Study 24: the walk, assembled from his picks. Home is today's stone (20: photograph and poem broken across the
   facets); press in (20 d); each world's poem arrives line by line, doors last (17 d); a door line crosses through
   the gem (22 c); and on. ?vocab= picks which of 21's vocabularies chooses the doors and where they lead; ?name=
   how much of the idea a visitor sees. One canvas draws every stone. Numbers live in defaults.json. */
:root {
  --ink-seam: #0d0c0b; --ink-on: #f3efe6; --ink-on2: #c9c3b6;
  --sans: 'Space Grotesk', -apple-system, sans-serif; --serif: 'Fraunces', Georgia, serif;
  --ease: cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink-seam); color: var(--ink-on); }
a { color: inherit; }
#app { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#stone { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* the poem as read and tapped: the words are drawn on the stone, this layer holds their places */
#read { position: absolute; inset: 0; pointer-events: none; }
.verse { position: absolute; font: 300 18px/1.5 var(--serif); color: transparent; overflow: hidden; pointer-events: auto; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.verse.gone { pointer-events: none !important; }
.verse.scroll { overflow: auto; overscroll-behavior: contain; scrollbar-width: none; }
.verse.scroll::-webkit-scrollbar { display: none; }
.verse h2 { margin: 0 0 .7em; font: italic 400 1.22em/1.25 var(--serif); }
.verse h2 a { text-decoration: none; }
.verse .l { display: block; text-indent: -1em; padding-left: 1em; }
.verse .gap { display: block; height: .7em; }
.verse .door { text-decoration: none; pointer-events: none; outline: none; border-radius: 2px; }
.verse .tag { font: 400 .62em/1 var(--sans); letter-spacing: .1em; margin-left: .7em; white-space: nowrap; }
body[data-at="world"] .verse .l.shown .door { pointer-events: auto; cursor: pointer; }
.verse .door:focus-visible { outline: 1px solid rgba(243,239,230,.7); outline-offset: 3px; }
.verse h2:not(.shown) a { pointer-events: none; }
#idea { position: absolute; z-index: 5; margin: 0; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; white-space: nowrap;
  font: italic 300 clamp(22px, 2.6vw, 36px)/1.2 var(--serif); color: var(--ink-on); text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 26px rgba(0,0,0,.85); }

/* the mat: name, where he is, the way out */
header { position: fixed; z-index: 9; left: clamp(16px, 3.4vw, 56px); bottom: clamp(18px, 5vh, 56px); max-width: 34ch; pointer-events: none; color: #ede7d9; }
header h1 { margin: 0; font: 500 1.15rem/1 var(--sans); letter-spacing: .01em; }
header h1 a { text-decoration: none; pointer-events: auto; }
header p { margin: 10px 0 14px; font: italic 300 1.0625rem/1.4 var(--serif); opacity: .86; }
header p:empty { display: none; }
header nav { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 18px; font: 400 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
header nav a { color: var(--ink-on2); text-decoration: none; transition: color .2s var(--ease); text-shadow: 0 1px 8px rgba(0,0,0,.6); }
header nav a:hover, header nav a:focus-visible { color: #fff; }
.cap { position: fixed; z-index: 9; right: clamp(16px, 3.4vw, 56px); bottom: clamp(18px, 5vh, 56px); margin: 0; font: 400 .7rem/1.5 var(--sans); letter-spacing: .012em; color: var(--ink-on2); text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.vs { position: fixed; top: 10px; right: 10px; z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font: 400 .72rem/1 var(--sans); }
.vs span { display: flex; gap: 2px; }
.vs a { text-decoration: none; color: var(--ink-on2); padding: 5px 7px; border-radius: 6px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.vs a[aria-current] { color: #ede7d9; background: rgba(127,127,127,.22); }
@media (max-width: 640px) {
  header { left: 16px; right: 16px; bottom: 16px; max-width: none; }
  header p { margin: 6px 0 10px; font-size: .95rem; }
  .cap { left: 16px; right: auto; top: 74px; bottom: auto; text-align: left; max-width: 70%; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="stone" aria-hidden="true"></canvas>
  <div id="read"></div>
  <p id="idea" aria-hidden="true"></p>
  <header id="mat">
    <h1><a href="/">kahran singh</a></h1>
    <p id="where"></p>
    <nav aria-label="The rest of the site"><a href="/about.html">about</a><a href="/photography.html">photos</a><a href="/poetry.html">poems</a><a href="/#flow">tools</a></nav>
  </header>
  <p class="cap" id="cap"></p>
</div>
<nav class="vs" aria-label="Study 24 switches">
  <span><a href="?vocab=pairs" data-vocab="pairs">pairs</a><a href="?vocab=questions" data-vocab="questions">questions</a><a href="?vocab=nouns" data-vocab="nouns">nouns</a><a href="?vocab=his" data-vocab="his">his</a></span>
  <span><a href="?name=never" data-name="never">never</a><a href="?name=crossing" data-name="crossing">crossing</a><a href="?name=door" data-name="door">door</a></span>
</nav>

<script type="module">
addEventListener('unhandledrejection', e => console.error('unhandled: ' + (e.reason && e.reason.stack || e.reason)))
const Q = new URLSearchParams(location.search)
const T = await window.S24T
const num = (k, f) => { const x = parseFloat(T[k]); return Number.isFinite(x) ? x : f }
const VOCABS = ['pairs', 'questions', 'nouns', 'his'], NAMES = ['never', 'crossing', 'door']
const VOCAB = VOCABS.includes(Q.get('vocab')) ? Q.get('vocab') : VOCABS.includes(T['walk-vocab']) ? T['walk-vocab'] : 'his'
const NAME = NAMES.includes(Q.get('name')) ? Q.get('name') : NAMES.includes(T['walk-name']) ? T['walk-name'] : 'crossing'
const qs = (o = {}) => '?' + new URLSearchParams({ vocab: VOCAB, name: NAME, ...o }).toString()
document.querySelectorAll('.vs a').forEach(a => { const v = a.dataset.vocab, n = a.dataset.name
  a.href = qs(v ? { vocab: v } : { name: n }); if (v === VOCAB || n === NAME) a.setAttribute('aria-current', 'true') })
document.body.dataset.vocab = VOCAB; document.body.dataset.name = NAME

const $ = s => document.querySelector(s)
const app = $('#app'), cv = $('#stone'), g = cv.getContext('2d'), readEl = $('#read'), mat = $('#mat'), cap = $('#cap'), ideaEl = $('#idea')
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const sleep = ms => new Promise(r => setTimeout(r, ms))
let W = 0, H = 0, DPR = 1
const phone = () => W < 640
function size() { W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR) }
size()
await Promise.race([Promise.all(['300 18px Fraunces', 'italic 400 18px Fraunces', 'italic 300 30px Fraunces', '400 12px "Space Grotesk"'].map(f => document.fonts.load(f))), sleep(3000)]) // the poem is measured and drawn in its own face
const [ctx, DJ] = await Promise.all([S14.load($('#where')), fetch('doors.json').then(r => r.json())])
const VOC = DJ.vocabs[VOCAB], data = ctx.data, stanzasOf = ctx.stanzasOf

/* ---------- small geometry ---------- */
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = Math.imul(s ^ s >>> 15, 2246822507) + 0x9e3779b9 >>> 0, ((s ^ s >>> 13) >>> 0) / 4294967296) }
function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v
const ss = (a, b, t) => clamp01((t - a) / (b - a))
const io = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2
function centroid(p) { let a = 0, x = 0, y = 0; for (let i = 0; i < p.length; i++) { const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length], c = x0 * y1 - x1 * y0; a += c; x += (x0 + x1) * c; y += (y0 + y1) * c } a *= .5; return a ? [x / (6 * a), y / (6 * a)] : p[0] || [0, 0] }
const area2 = P => P.reduce((a, [x0, y0], i) => { const [x1, y1] = P[(i + 1) % P.length]; return a + x0 * y1 - x1 * y0 }, 0)
const bbox = p => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of p) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y } return [x0, y0, x1, y1] }
const meets = (b, [x, y, w, h], pad = 0) => b[2] > x - pad && b[0] < x + w + pad && b[3] > y - pad && b[1] < y + h + pad
const inPoly = ([x, y], p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c } return c }
function clipHalf(P, f) { const o = []
  for (let k = 0; k < P.length; k++) { const a = P[k], b = P[(k + 1) % P.length], fa = f(a), fb = f(b)
    if (fa <= 0) o.push(a)
    if ((fa <= 0) !== (fb <= 0)) { const t = fa / (fa - fb); o.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]) } }
  return o }
const clean = P => P.filter((p, i) => { const q = P[(i + 1) % P.length]; return Math.hypot(p[0] - q[0], p[1] - q[1]) > .05 })
function voronoi(S) { // 05 B's: the wind draws the facets out
  const st = 1 + Math.min(num('wind', 8), 40) / 45, w = W / st, Tt = S.map(([x, y]) => [x / st, y])
  return Tt.map((s, i) => { let P = [[0, 0], [w, 0], [w, H], [0, H]]
    for (let j = 0; j < Tt.length && P.length; j++) { if (j === i) continue; const t = Tt[j], nx = t[0] - s[0], ny = t[1] - s[1]; if (!nx && !ny) continue
      const mx = (s[0] + t[0]) / 2, my = (s[1] + t[1]) / 2; P = clipHalf(P, ([x, y]) => (x - mx) * nx + (y - my) * ny) }
    return clean(P.map(([x, y]) => [x * st, y])) }) }
function inset(P, s) { // a true offset of every edge, so the seam is the same width all round
  const n = P.length; if (n < 3 || s <= 0) return P
  const sg = area2(P) > 0 ? 1 : -1, c = centroid(P)
  const L = P.map((a, i) => { const b = P[(i + 1) % n]; let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; return { p: [a[0] - dy * sg * s, a[1] + dx * sg * s], d: [dx, dy] } })
  const Qp = P.map((v, i) => { const A = L[(i - 1 + n) % n], B = L[i], den = A.d[0] * B.d[1] - A.d[1] * B.d[0]
    if (Math.abs(den) < 1e-6) return B.p
    const t = ((B.p[0] - A.p[0]) * B.d[1] - (B.p[1] - A.p[1]) * B.d[0]) / den, q = [A.p[0] + A.d[0] * t, A.p[1] + A.d[1] * t]
    if (Math.hypot(q[0] - v[0], q[1] - v[1]) > s * 5) { const dx = c[0] - v[0], dy = c[1] - v[1], d = Math.hypot(dx, dy) || 1; return [v[0] + dx / d * s * 1.5, v[1] + dy / d * s * 1.5] }
    return q })
  return area2(Qp) * area2(P) > 0 ? Qp : [] }
const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]]
const tr = (x, y) => [1, 0, 0, 1, x, y], sc = (x, y = x) => [x, 0, 0, y, 0, 0]
const about = ([cx, cy], ...ms) => [tr(cx, cy), ...ms, tr(-cx, -cy)].reduce(mul)

/* ---------- the cut: 20's plant (a hero facet, two rings, the rest scattered), always the same count, so cuts morph cell for cell ---------- */
function plant(key) {
  const r = rng(hash(key + '|24|' + W)), count = Math.round(phone() ? num('facets-phone', 15) : num('facets-desk', 26)), min = Math.min(W, H), S = []
  let loose = 1
  const add = (x, y, gap) => { if (x < 2 || y < 2 || x > W - 2 || y > H - 2) return; if (S.some(([a, b]) => Math.hypot(a - x, b - y) < gap * loose)) return; S.push([x, y]) }
  const hero = phone() ? [W * .5, H * .2] : [W * .36, H * .44], ax = phone() ? W * .36 : W * .17, ay = phone() ? H * .12 : H * .24
  add(hero[0], hero[1], 0)
  const n1 = phone() ? 6 : 8, rot = r() * Math.PI * 2
  for (let k = 0; k < n1; k++) { const t = rot + k / n1 * Math.PI * 2 + (r() - .5) * .16; add(hero[0] + Math.cos(t) * ax, hero[1] + Math.sin(t) * ay, min * .1) }
  for (let k = 0; k < n1 * 2; k++) { const t = rot + (k + .5) / (n1 * 2) * Math.PI * 2 + (r() - .5) * .3; add(hero[0] + Math.cos(t) * ax * 1.9, hero[1] + Math.sin(t) * ay * 1.9, min * .1) }
  for (let k = 0; k < 900 && S.length < count; k++) add(r() * W, r() * H, min * .12)
  while (S.length < count) { loose *= .8; for (let k = 0; k < 300 && S.length < count; k++) add(r() * W, r() * H, min * .12) }
  return S.slice(0, count)
}
function match(A, B) { // B's order so B[out[i]] is A[i]'s partner; the hero keeps the hero
  const n = A.length, out = [0], used = new Set([0]), taken = new Set([0]), pairs = []
  for (let i = 1; i < n; i++) for (let j = 1; j < n; j++) pairs.push([Math.hypot(A[i][0] - B[j][0], A[i][1] - B[j][1]), i, j])
  pairs.sort((p, q) => p[0] - q[0])
  for (const [, i, j] of pairs) { if (used.has(i) || taken.has(j)) continue; out[i] = j; used.add(i); taken.add(j) }
  return out }

/* ---------- the worlds and their doors (the vocabulary chooses both) ---------- */
const poemBy = s => data.poems.find(p => p.slug === s), photoBy = src => data.photos.find(p => p.src === src)
const keyOf = w => w.poem.slug + '~' + w.photo.src.replace('/photos/', '')
const pairOf = key => { const [s, f] = String(key || '').split('~'); const poem = poemBy(s), photo = photoBy('/photos/' + f); return poem && photo ? { poem, photo } : null }
const placedCache = new Map()
function placed(poem) { // the doors a poem can show: one per line, each phrase inside one line as written
  if (placedCache.has(poem.slug)) return placedCache.get(poem.slug)
  const list = VOC.poems[poem.slug] || [], used = new Set(), out = []
  stanzasOf(poem).flat().forEach((line, li) => { const k = list.findIndex((d, k) => !used.has(k) && line.includes(d.phrase)); if (k >= 0) { used.add(k); out.push({ ...list[k], k, line }) } })
  placedCache.set(poem.slug, out); return out }
const good = slug => { const p = poemBy(slug); return !!p && placed(p).length >= 2 } // somewhere with a way on
const wordOf = word => VOC.words.find(x => x.word === word) || { word, concepts: [], poems: [], photos: [] }
function target(from, d, seen, taken) { // the door's idea, carried to a poem and a photograph that hold it and are not behind you
  const Wd = wordOf(d.word), h = hash(from.poem.slug + '|' + d.word + '|' + VOCAB)
  const near = VOC.words.filter(x => x !== Wd && x.concepts.some(c => Wd.concepts.includes(c)))
  const free = s => good(s) && !seen.poems.has(s) && !taken.has(s) && s !== from.poem.slug
  let how = 'word', ps = Wd.poems.filter(free)
  if (!ps.length) { how = 'near'; ps = [...new Set(near.flatMap(x => x.poems))].filter(free) }
  if (!ps.length) { how = 'any'; ps = data.poems.map(p => p.slug).filter(free) }
  const pfree = s => photoBy(s) && !seen.photos.has(s) && s !== from.photo.src
  let fs = Wd.photos.filter(pfree), phow = 'word'
  if (!fs.length) { phow = 'near'; fs = [...new Set(near.flatMap(x => x.photos))].filter(pfree) }
  if (!fs.length) { phow = 'any'; fs = data.photos.map(p => p.src).filter(pfree) }
  const poem = poemBy(ps[h % ps.length]), photo = photoBy(fs[(h >>> 7) % fs.length])
  return { poem, photo, how, phow } }
function doorsFor(w, trail) {
  const seen = { poems: new Set(trail.map(k => k.split('~')[0])), photos: new Set(trail.map(k => '/photos/' + k.split('~')[1])) }, taken = new Set()
  let ds = placed(w.poem).map(d => { const to = target(w, d, seen, taken); taken.add(to.poem.slug); seen.photos.add(to.photo.src); return { ...d, to } })
  return ds }

/* ---------- photographs: covering the screen once, the shade under the poem laid into them ---------- */
const raw = {}, prepared = new Map()
const loadImg = src => raw[src] ||= new Promise(res => { const im = new Image(); im.decoding = 'async'; im.onload = () => res(im); im.onerror = () => res(null); im.src = src })
function poemRect() { // 20's
  if (phone()) { const top = Math.round(H * .34), bottom = H - mat.offsetHeight - 34; return [16, top, W - 32, Math.max(160, bottom - top)] }
  const w = Math.min(440, W * .36), right = Math.max(32, W * .06), top = Math.round(H * .13); return [W - w - right, top, w, H * .74] }
async function photo(p) {
  const tag = `${p.src}@${cv.width}x${cv.height}`
  if (prepared.has(tag)) return prepared.get(tag)
  const im = await loadImg(p.src), c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height
  const x = c.getContext('2d'); x.fillStyle = '#24221f'; x.fillRect(0, 0, c.width, c.height); c.ok = false
  if (im && im.naturalWidth) {
    const a = im.naturalWidth / im.naturalHeight, b = c.width / c.height, [sw, sh] = a > b ? [im.naturalHeight * b, im.naturalHeight] : [im.naturalWidth, im.naturalWidth / b]
    if (/Monochrome/.test(p.caption || '')) x.filter = 'grayscale(1) contrast(1.06) brightness(.94)'
    x.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, 0, 0, c.width, c.height); x.filter = 'none'; c.ok = true
  }
  const A = num('scrim-alpha', .72), s = (g0, stops) => { stops.forEach(([o, al]) => g0.addColorStop(o, `rgba(8,8,7,${al})`)); x.fillStyle = g0; x.fillRect(0, 0, c.width, c.height) }
  x.setTransform(DPR, 0, 0, DPR, 0, 0)
  if (phone()) s(x.createLinearGradient(0, H, 0, 0), [[0, A], [.48, A * .8], [.66, 0]])
  else { s(x.createLinearGradient(W, 0, 0, 0), [[0, A], [.32, A * .7], [.52, 0]])
    const L = W * Math.sin(.35) + H * Math.cos(.35); s(x.createLinearGradient(0, H, Math.sin(.35) * L, H - Math.cos(.35) * L), [[0, A * .9], [.38, 0]]) }
  prepared.set(tag, c); if (prepared.size > 8) prepared.delete(prepared.keys().next().value)
  return c }

/* ---------- the poem: laid out in the page (to be read, selected, tapped), drawn on the stone in its own face ---------- */
function verseEl(w, doors) {
  const v = document.createElement('div'); v.className = 'verse'
  const h = document.createElement('h2'), a = document.createElement('a'); a.href = '/poems/' + w.poem.slug + '.html'; a.textContent = w.poem.title; h.append(a); v.append(h)
  let i = 0
  stanzasOf(w.poem).forEach((st, si) => {
    if (si) v.append(Object.assign(document.createElement('span'), { className: 'gap' }))
    st.forEach(t => { const l = document.createElement('span'); l.className = 'l'; l.dataset.i = i++
      const d = doors.find(d => d.line === t && !d.el)
      if (d) { const at = t.indexOf(d.phrase), door = document.createElement('a')
        door.className = 'door'; door.dataset.k = d.k; door.href = qs({ w: keyOf(d.to) }); door.textContent = d.phrase; d.el = door
        l.dataset.door = ''; l.append(t.slice(0, at), door, t.slice(at + d.phrase.length))
        if (NAME === 'door') l.append(Object.assign(document.createElement('span'), { className: 'tag', textContent: d.word })) }
      else l.textContent = t
      v.append(l) }) })
  return v }
function fit(v, w, h) { const max = num('poem-max-px', 18), min = num('poem-min-px', 13)
  Object.assign(v.style, { width: w + 'px', height: 'auto' }); v.classList.remove('scroll')
  let px = max; v.style.fontSize = px + 'px'
  while (v.scrollHeight > h && px > min) { px = Math.max(min, px - .5); v.style.fontSize = px + 'px' }
  v.style.height = Math.min(h, v.scrollHeight) + 'px'
  if (v.scrollHeight > h + 1) { v.classList.add('scroll'); v.style.height = h + 'px' } }

  if (e.button > 0 || e.target.closest('header,a,button') || !cur || cur.mode !== 'home' || busy) return
  pressStart([e.clientX, e.clientY]); try { app.setPointerCapture(e.pointerId) } catch {} })
app.addEventListener('pointerup', () => pressUp()); app.addEventListener('pointercancel', () => pressUp())
app.addEventListener('click', e => {
  const a = e.target.closest('.verse .door'); if (!a) return
  e.preventDefault(); if (busy || !cur || cur.mode !== 'world' || !a.closest('.l.shown')) return // mid-way, a second touch goes nowhere
  const d = cur.doors.find(d => d.el === a); if (d) cross(d) })
addEventListener('keydown', e => {
  if (!cur || cur.mode !== 'home' || busy || e.target.closest?.('a,button,input')) return
  if (['Enter', ' '].includes(e.key)) { e.preventDefault(); pressStart([W / 2, H / 2]).then(() => pressUp()) } })
addEventListener('popstate', () => location.reload())

/* ---------- begin: today's stone, or the world in the address ---------- */
window.S24 = { vocab: VOCAB, name: NAME, expect: null, word: null, trail: [],
  get at() { return document.body.dataset.at }, get busy() { return busy }, get t() { return crossing && !crossing.calm ? clamp01((performance.now() - crossing.t0) / crossing.ms) : null },
  get world() { return cur && { key: cur.key, slug: cur.poem.slug, title: cur.poem.title, photo: cur.photo.src, mode: cur.mode, imgOk: !!cur.img.ok, arrived: !!cur.arrived } },
  get doors() { return cur ? cur.doors.map(d => ({ k: d.k, phrase: d.phrase, word: d.word, text: d.el.textContent, line: d.el.closest('.l').textContent, to: keyOf(d.to), how: d.to.how, phow: d.to.phow,
    box: (() => { const b = d.el.getClientRects()[0] || d.el.getBoundingClientRect(); return [b.left, b.top, b.width, b.height] })() })) : [] },
  get lines() { return cur ? cur.lines.slice(1).map((l, i) => ({ door: 'door' in l.dataset, shown: cur.Tg[i + 1] === 1, a: cur.A[i + 1] })) : [] },
  get facets() { return cur ? cur.cells.filter(P => P.length > 2).length : 0 },
  get broken() { return cur ? cur.cells.filter(P => P.length > 2 && meets(bbox(P), cur.R)).length : 0 },
  read() { const w = 96, h = Math.round(96 * H / W), c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(cv, 0, 0, w, h)
    const p = x.getImageData(0, 0, w, h).data; let s = 0, dark = 0, n = w * h; for (let i = 0; i < p.length; i += 4) { const l = (p[i] * .2126 + p[i + 1] * .7152 + p[i + 2] * .0722) / 255; s += l; if (l < .06) dark++ } return { mean: s / n, bare: dark / n } } }
const direct = pairOf(Q.get('w'))
if (direct) { const tr0 = (history.state && history.state.trail || []).filter(k => k !== keyOf(direct)); const w = await makeWorld(direct, 'world', tr0); show(w); at('world'); S24.trail = w.trail.slice(); arrive(w, num('arrive-delay-ms', 500)) }
else { const w = await makeWorld({ poem: ctx.poem, photo: ctx.photo }, 'home', []); show(w); at('stone'); S24.trail = w.trail.slice(); w.lines.forEach((l, i) => { w.Tg[i] = w.A[i] = 1; l.classList.add('shown') }); w.dirty = true; w.doors.forEach(d => photo(d.to.photo)) }
requestAnimationFrame(frame)
let rz = 0, lastWH = innerWidth + 'x' + innerHeight
const rebuild = async () => { if (busy) return; size(); prepared.clear(); const o = cur, w = await makeWorld({ poem: o.poem, photo: o.photo }, o.mode, o.trail.slice(0, -1)); drop(o); show(w)
  w.lines.forEach((l, i) => { w.Tg[i] = w.A[i] = 1; l.classList.add('shown') }); w.arrived = true; w.dirty = true }
addEventListener('resize', () => { const wh = innerWidth + 'x' + innerHeight; if (wh === lastWH) return; lastWH = wh; clearTimeout(rz); rz = setTimeout(rebuild, 250) })
document.addEventListener('s24:tune', rebuild)
document.body.dataset.ready = 'yes'
