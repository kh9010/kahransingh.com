<meta name="description" content="The walk through the worlds, the photograph whole, and where each facet of it goes.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* Study 28: 26 with one question changed. Kahran on 26 a, 8 Nov: "you lose the continuity of the photo. it has to still be the photo,
   they just have to logically go somewhere." So the stone always shows this world's photograph whole (every facet its own piece of it,
   as in 24), and the question is where each facet goes. ?f=
     a  doors and windows (Kahran, 8 Nov: "some of them take you to another photo, the equivalent of a linkable part of the poem but as a photo"):
        two or three photo doors, the facets another photograph answers most nearly, marked like a door line (a quiet underline);
        every other facet is a window onto why this world is here: where and when, how far from here, the idea, the door you came by, today's sky
     b  the moment's matches: each facet to the real match (home: v2/pick.js runners-up; a world: the door's idea) whose photograph answers its fragment
     c  photo kin: each facet to the photograph, of all of them, that answers its fragment (26 b)
     d  joined: the facet a door line lies across is that door's (photo and poem as one, each lights the other); the rest as c
   Any facet that leads somewhere crosses from itself: the next photograph is first seen with its answering region lying in that facet.
   The arrival is 17 d without doors last: lines in order, a door open as its line appears. Door lines win over facets.
   Numbers live in defaults.json. */
:root {
  --ink-seam: #0d0c0b; --ink-on: #f3efe6; --ink-on2: #c9c3b6;
  --sans: 'Space Grotesk', -apple-system, sans-serif; --serif: 'Fraunces', Georgia, serif;
  --ease: cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink-seam); color: var(--ink-on); }
a { color: inherit; }
#app { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#stone { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* the poem as read and tapped: the words are drawn on the stone, this layer holds their places */
#read { position: absolute; inset: 0; pointer-events: none; }
.verse { position: absolute; font: 300 18px/1.5 var(--serif); color: transparent; overflow: hidden; pointer-events: auto; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.verse.gone { pointer-events: none !important; }
.verse.scroll { overflow: auto; overscroll-behavior: contain; scrollbar-width: none; }
.verse.scroll::-webkit-scrollbar { display: none; }
.verse h2 { margin: 0 0 .7em; font: italic 400 1.22em/1.25 var(--serif); }
.verse h2 a { text-decoration: none; }
.verse .l { display: block; text-indent: -1em; padding-left: 1em; }
.verse .gap { display: block; height: .7em; }
.verse .door { text-decoration: none; pointer-events: none; outline: none; border-radius: 2px; }
.verse .tag { font: 400 .62em/1 var(--sans); letter-spacing: .1em; margin-left: .7em; white-space: nowrap; }
body[data-at="world"] .verse .l.shown .door { pointer-events: auto; cursor: pointer; }
.verse .door:focus-visible { outline: 1px solid rgba(243,239,230,.7); outline-offset: 3px; }
.verse h2:not(.shown) a { pointer-events: none; }
body[data-at="world"] #app.over { cursor: pointer; }
body[data-at="world"] #app.over .verse .l:not([data-door]) { cursor: pointer; }
#back { position: absolute; z-index: 4; margin: 0; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none;
  font: italic 300 1.0625rem/1.3 var(--serif); color: var(--ink-on); text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 18px rgba(0,0,0,.9); }
#back.on { pointer-events: auto; }
#back a { text-decoration: none; border-bottom: 1px solid rgba(243,239,230,.45); }
#back small { display: block; margin-top: .45em; font: 400 .66rem/1.3 var(--sans); font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-on2); }
#idea { position: absolute; z-index: 5; margin: 0; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; white-space: nowrap;
  font: italic 300 clamp(22px, 2.6vw, 36px)/1.2 var(--serif); color: var(--ink-on); text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 26px rgba(0,0,0,.85); }

/* the mat: name, where he is, the way out */
header { position: fixed; z-index: 9; left: clamp(16px, 3.4vw, 56px); bottom: clamp(18px, 5vh, 56px); max-width: 34ch; pointer-events: none; color: #ede7d9; }
header h1 { margin: 0; font: 500 1.15rem/1 var(--sans); letter-spacing: .01em; }
header h1 a { text-decoration: none; pointer-events: auto; }
header p { margin: 10px 0 14px; font: italic 300 1.0625rem/1.4 var(--serif); opacity: .86; }
header p:empty { display: none; }
header nav { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 18px; font: 400 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
header nav a { color: var(--ink-on2); text-decoration: none; transition: color .2s var(--ease); text-shadow: 0 1px 8px rgba(0,0,0,.6); }
header nav a:hover, header nav a:focus-visible { color: #fff; }
.cap { position: fixed; z-index: 9; right: clamp(16px, 3.4vw, 56px); bottom: clamp(18px, 5vh, 56px); margin: 0; font: 400 .7rem/1.5 var(--sans); letter-spacing: .012em; color: var(--ink-on2); text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.vs { position: fixed; top: 10px; right: 10px; z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font: 400 .72rem/1 var(--sans); }
.vs { pointer-events: none; } .vs a { pointer-events: auto; } /* the gaps in the switch belong to the stone beneath */
.vs span { display: flex; gap: 2px; }
.vs a { text-decoration: none; color: var(--ink-on2); padding: 5px 7px; border-radius: 6px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.vs a[aria-current] { color: #ede7d9; background: rgba(127,127,127,.22); }
@media (max-height: 560px) and (orientation: landscape) {
  header { left: 16px; bottom: 14px; max-width: 42vw; }
  header p { margin: 6px 0 8px; font-size: .9rem; }
  .cap { left: 16px; right: auto; top: 40px; bottom: auto; text-align: left; max-width: 44vw; }
  .vs { flex-direction: row; gap: 8px; top: 6px; }
  .vs a { padding: 4px 5px; }
}
@media (max-width: 640px) and (orientation: portrait) {
  header { left: 16px; right: 16px; bottom: 16px; max-width: none; }
  header p { margin: 6px 0 10px; font-size: .95rem; }
  .cap { left: 16px; right: auto; top: 74px; bottom: auto; text-align: left; max-width: 70%; }
}
</style>

<body>

    <nav aria-label="The rest of the site"><a href="/about.html">about</a><a href="/photography.html">photos</a><a href="/poetry.html">poems</a><a href="/#flow">tools</a></nav>

</div>
<nav class="vs" aria-label="Study 28 switches">
  <span><a href="?f=a" data-f="a">windows</a><a href="?f=b" data-f="b">matches</a><a href="?f=c" data-f="c">kin</a><a href="?f=d" data-f="d">joined</a></span>
  <span><a href="?vocab=pairs" data-vocab="pairs">pairs</a><a href="?vocab=questions" data-vocab="questions">questions</a><a href="?vocab=nouns" data-vocab="nouns">nouns</a><a href="?vocab=his" data-vocab="his">his</a></span>
  <span><a href="?name=never" data-name="never">never</a><a href="?name=crossing" data-name="crossing">crossing</a><a href="?name=door" data-name="door">door</a></span>

<script type="module">
addEventListener('unhandledrejection', e => console.error('unhandled: ' + (e.reason && e.reason.stack || e.reason)))
const Q = new URLSearchParams(location.search)
const T = await window.S28T
const num = (k, f) => { const x = parseFloat(T[k]); return Number.isFinite(x) ? x : f }
const VOCABS = ['pairs', 'questions', 'nouns', 'his'], NAMES = ['never', 'crossing', 'door'], FS = ['a', 'b', 'c', 'd']
const VOCAB = VOCABS.includes(Q.get('vocab')) ? Q.get('vocab') : VOCABS.includes(T['walk-vocab']) ? T['walk-vocab'] : 'his'
const NAME = NAMES.includes(Q.get('name')) ? Q.get('name') : NAMES.includes(T['walk-name']) ? T['walk-name'] : 'crossing'
const F = FS.includes(Q.get('f')) ? Q.get('f') : FS.includes(T['facet-way']) ? T['facet-way'] : 'a'
const qs = (o = {}) => '?' + new URLSearchParams({ vocab: VOCAB, name: NAME, f: F, ...o }).toString()
document.querySelectorAll('.vs a').forEach(a => { const v = a.dataset.vocab, n = a.dataset.name, f = a.dataset.f
  a.href = qs(v ? { vocab: v } : n ? { name: n } : { f }); if (v === VOCAB || n === NAME || f === F) a.setAttribute('aria-current', 'true') })
document.body.dataset.vocab = VOCAB; document.body.dataset.name = NAME; document.body.dataset.f = F

const $ = s => document.querySelector(s)
const app = $('#app'), cv = $('#stone'), g = cv.getContext('2d'), readEl = $('#read'), mat = $('#mat'), cap = $('#cap'), ideaEl = $('#idea'), backEl = $('#back')
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const sleep = ms => new Promise(r => setTimeout(r, ms))
let W = 0, H = 0, DPR = 1
const phone = () => W < 640 && H > W * .9 // a phone held upright; a phone on its side is short, see low() (carried from 24, 7 Nov)
const low = () => H < 560 && W > H
function size() { W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR) }
size()
await Promise.race([Promise.all(['300 18px Fraunces', 'italic 400 18px Fraunces', 'italic 300 30px Fraunces', '400 12px "Space Grotesk"'].map(f => document.fonts.load(f))), sleep(3000)]) // the poem is measured and drawn in its own face
const [ctx, DJ, KJ, HERE] = await Promise.all([S14.load($('#where')), fetch('doors.json').then(r => r.json()), fetch('kin.json').then(r => r.json()), fetch('/v2/place.json').then(r => r.json()).catch(() => null)])
const KIN = KJ.photos
const VOC = DJ.vocabs[VOCAB], data = ctx.data, stanzasOf = ctx.stanzasOf

/* ---------- small geometry ---------- */
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = Math.imul(s ^ s >>> 15, 2246822507) + 0x9e3779b9 >>> 0, ((s ^ s >>> 13) >>> 0) / 4294967296) }
function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v
const ss = (a, b, t) => clamp01((t - a) / (b - a))
const io = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2
function centroid(p) { let a = 0, x = 0, y = 0; for (let i = 0; i < p.length; i++) { const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length], c = x0 * y1 - x1 * y0; a += c; x += (x0 + x1) * c; y += (y0 + y1) * c } a *= .5; return a ? [x / (6 * a), y / (6 * a)] : p[0] || [0, 0] }
const area2 = P => P.reduce((a, [x0, y0], i) => { const [x1, y1] = P[(i + 1) % P.length]; return a + x0 * y1 - x1 * y0 }, 0)
const bbox = p => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of p) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y } return [x0, y0, x1, y1] }
const meets = (b, [x, y, w, h], pad = 0) => b[2] > x - pad && b[0] < x + w + pad && b[3] > y - pad && b[1] < y + h + pad
const inPoly = ([x, y], p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c } return c }
function clipHalf(P, f) { const o = []
  for (let k = 0; k < P.length; k++) { const a = P[k], b = P[(k + 1) % P.length], fa = f(a), fb = f(b)
    if (fa <= 0) o.push(a)
    if ((fa <= 0) !== (fb <= 0)) { const t = fa / (fa - fb); o.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]) } }
  return o }
const clean = P => P.filter((p, i) => { const q = P[(i + 1) % P.length]; return Math.hypot(p[0] - q[0], p[1] - q[1]) > .05 })
function voronoi(S) { // 05 B's: the wind draws the facets out
  const st = 1 + Math.min(num('wind', 8), 40) / 45, w = W / st, Tt = S.map(([x, y]) => [x / st, y])
  return Tt.map((s, i) => { let P = [[0, 0], [w, 0], [w, H], [0, H]]
    for (let j = 0; j < Tt.length && P.length; j++) { if (j === i) continue; const t = Tt[j], nx = t[0] - s[0], ny = t[1] - s[1]; if (!nx && !ny) continue
      const mx = (s[0] + t[0]) / 2, my = (s[1] + t[1]) / 2; P = clipHalf(P, ([x, y]) => (x - mx) * nx + (y - my) * ny) }
    return clean(P.map(([x, y]) => [x * st, y])) }) }
function inset(P, s) { // a true offset of every edge, so the seam is the same width all round
  const n = P.length; if (n < 3 || s <= 0) return P
  const sg = area2(P) > 0 ? 1 : -1, c = centroid(P)
  const L = P.map((a, i) => { const b = P[(i + 1) % n]; let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; return { p: [a[0] - dy * sg * s, a[1] + dx * sg * s], d: [dx, dy] } })
  const Qp = P.map((v, i) => { const A = L[(i - 1 + n) % n], B = L[i], den = A.d[0] * B.d[1] - A.d[1] * B.d[0]
    if (Math.abs(den) < 1e-6) return B.p
    const t = ((B.p[0] - A.p[0]) * B.d[1] - (B.p[1] - A.p[1]) * B.d[0]) / den, q = [A.p[0] + A.d[0] * t, A.p[1] + A.d[1] * t]
    if (Math.hypot(q[0] - v[0], q[1] - v[1]) > s * 5) { const dx = c[0] - v[0], dy = c[1] - v[1], d = Math.hypot(dx, dy) || 1; return [v[0] + dx / d * s * 1.5, v[1] + dy / d * s * 1.5] }
    return q })
  return area2(Qp) * area2(P) > 0 ? Qp : [] }
const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]]
const tr = (x, y) => [1, 0, 0, 1, x, y], sc = (x, y = x) => [x, 0, 0, y, 0, 0]
const about = ([cx, cy], ...ms) => [tr(cx, cy), ...ms, tr(-cx, -cy)].reduce(mul)

/* ---------- the cut: 20's plant (a hero facet, two rings, the rest scattered), always the same count, so cuts morph cell for cell ---------- */
function plant(key) {
  const r = rng(hash(key + '|24|' + W)), count = Math.round(phone() ? num('facets-phone', 15) : low() ? num('facets-low', 15) : num('facets-desk', 26)), min = Math.min(W, H), S = [] // a short screen gets the phone's fewer, larger facets, so each is big enough to touch
  let loose = 1
  const add = (x, y, gap) => { if (x < 2 || y < 2 || x > W - 2 || y > H - 2) return; if (S.some(([a, b]) => Math.hypot(a - x, b - y) < gap * loose)) return; S.push([x, y]) }
  const hero = phone() ? [W * .5, H * .2] : [W * .36, H * .44], ax = phone() ? W * .36 : W * .17, ay = phone() ? H * .12 : H * .24
  add(hero[0], hero[1], 0)
  const n1 = phone() ? 6 : 8, rot = r() * Math.PI * 2
  for (let k = 0; k < n1; k++) { const t = rot + k / n1 * Math.PI * 2 + (r() - .5) * .16; add(hero[0] + Math.cos(t) * ax, hero[1] + Math.sin(t) * ay, min * .1) }
  for (let k = 0; k < n1 * 2; k++) { const t = rot + (k + .5) / (n1 * 2) * Math.PI * 2 + (r() - .5) * .3; add(hero[0] + Math.cos(t) * ax * 1.9, hero[1] + Math.sin(t) * ay * 1.9, min * .1) }
  for (let k = 0; k < 900 && S.length < count; k++) add(r() * W, r() * H, min * .12)
  while (S.length < count) { loose *= .8; for (let k = 0; k < 300 && S.length < count; k++) add(r() * W, r() * H, min * .12) }
  return S.slice(0, count)
}
function match(A, B) { // B's order so B[out[i]] is A[i]'s partner; the hero keeps the hero
  const n = A.length, out = [0], used = new Set([0]), taken = new Set([0]), pairs = []
  for (let i = 1; i < n; i++) for (let j = 1; j < n; j++) pairs.push([Math.hypot(A[i][0] - B[j][0], A[i][1] - B[j][1]), i, j])
  pairs.sort((p, q) => p[0] - q[0])
  for (const [, i, j] of pairs) { if (used.has(i) || taken.has(j)) continue; out[i] = j; used.add(i); taken.add(j) }
  return out }

/* ---------- the worlds and their doors (the vocabulary chooses both) ---------- */
const poemBy = s => data.poems.find(p => p.slug === s), photoBy = src => data.photos.find(p => p.src === src)
const keyOf = w => w.poem.slug + '~' + w.photo.src.replace('/photos/', '')
const pairOf = key => { const [s, f] = String(key || '').split('~'); const poem = poemBy(s), photo = photoBy('/photos/' + f); return poem && photo ? { poem, photo } : null }
const placedCache = new Map()
function placed(poem) { // the doors a poem can show: one per line, each phrase inside one line as written
  if (placedCache.has(poem.slug)) return placedCache.get(poem.slug)
  const list = VOC.poems[poem.slug] || [], used = new Set(), out = []
  stanzasOf(poem).flat().forEach((line, li) => { const k = list.findIndex((d, k) => !used.has(k) && line.includes(d.phrase)); if (k >= 0) { used.add(k); out.push({ ...list[k], k, line }) } })
  placedCache.set(poem.slug, out); return out }
const good = slug => { const p = poemBy(slug); return !!p && placed(p).length >= 2 } // somewhere with a way on
const wordOf = word => VOC.words.find(x => x.word === word) || { word, concepts: [], poems: [], photos: [] }
function target(from, d, seen, taken) { // the door's idea, carried to a poem and a photograph that hold it and are not behind you
  const Wd = wordOf(d.word), h = hash(from.poem.slug + '|' + d.word + '|' + VOCAB)
  const near = VOC.words.filter(x => x !== Wd && x.concepts.some(c => Wd.concepts.includes(c)))
  const free = s => good(s) && !seen.poems.has(s) && !taken.has(s) && s !== from.poem.slug
  let how = 'word', ps = Wd.poems.filter(free)
  if (!ps.length) { how = 'near'; ps = [...new Set(near.flatMap(x => x.poems))].filter(free) }
  if (!ps.length) { how = 'any'; ps = data.poems.map(p => p.slug).filter(free) }
  const pfree = s => photoBy(s) && !seen.photos.has(s) && s !== from.photo.src
  let fs = Wd.photos.filter(pfree), phow = 'word'
  if (!fs.length) { phow = 'near'; fs = [...new Set(near.flatMap(x => x.photos))].filter(pfree) }
  if (!fs.length) { phow = 'any'; fs = data.photos.map(p => p.src).filter(pfree) }
  const poem = poemBy(ps[h % ps.length]), photo = photoBy(fs[(h >>> 7) % fs.length])
  return { poem, photo, how, phow } }
function doorsFor(w, trail) {
  const seen = { poems: new Set(trail.map(k => k.split('~')[0])), photos: new Set(trail.map(k => '/photos/' + k.split('~')[1])) }, taken = new Set()
  let ds = placed(w.poem).map(d => { const to = target(w, d, seen, taken); taken.add(to.poem.slug); seen.photos.add(to.photo.src); return { ...d, to } })
  return ds }

/* ---------- photographs: covering the screen once, the shade under the poem laid into them ---------- */
const raw = {}, prepared = new Map()
const loadImg = src => raw[src] ||= new Promise(res => { const im = new Image(); im.decoding = 'async'; im.onload = () => res(im); im.onerror = () => res(null); im.src = src })
function poemRect() { // 20's
  if (phone()) { const top = Math.round(H * .34), bottom = H - mat.offsetHeight - 34; return [16, top, W - 32, Math.max(160, bottom - top)] }
  if (low()) { const w = Math.min(440, W * .48), right = Math.max(16, W * .03), top = Math.round(H * .16); return [W - w - right, top, w, H - top - 14] } // on its side: the poem takes the right half, the mat keeps the left
  const w = Math.min(440, W * .36), right = Math.max(32, W * .06), top = Math.round(H * .13); return [W - w - right, top, w, H * .74] }
async function photo(p) {
  const tag = `${p.src}@${cv.width}x${cv.height}`
  if (prepared.has(tag)) return prepared.get(tag)
  const im = await loadImg(p.src), c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height
  const x = c.getContext('2d'); x.fillStyle = '#24221f'; x.fillRect(0, 0, c.width, c.height); c.ok = false

  if (hd) { to = hd.to; word = hd.word } // a door line: its door
  else if (pl && pl.kind === 'window') { homeWin = ci; FX.press = ci; return } // a window: it says its piece on the way up
  else if (pl && pl.kind === 'door') { to = pl.to; word = pl.word || null; said(ci, 'door', { to: keyOf(to) }) } // a facet: where that facet goes
  else { let best = cur.doors[0], bd = Infinity // elsewhere: the world behind the door line nearest the finger
    for (const d of cur.doors) { const b = d.el.getBoundingClientRect(), dd = Math.hypot(b.left + b.width / 2 - pt[0], b.top + b.height / 2 - pt[1]); if (dd < bd) { bd = dd; best = d } }
    to = best ? best.to : cur.fallback; word = best ? best.word : null }
  busy = true; at('entering'); S28.expect = keyOf(to); S28.word = word
  const p = pressing = { old: cur, pt, d: 0, gv: 0, t0: performance.now(), held: true, next: null }
  p.ready = makeWorld({ ...to, word, from: { phrase: hd ? hd.phrase : null, title: cur.poem.title } }, 'world', cur.trail).then(w => { p.next = w; return w })
  if (reduce()) { const w = await p.ready; pressing = null; return calmTo(w) }
  const ms = num('press-ms', 1100)
  const step = () => { if (pressing !== p || !p.held) return; p.d = Math.min(1, (performance.now() - p.t0) / ms); if (p.d >= 1) giveWay(p); else requestAnimationFrame(step) }
  requestAnimationFrame(step) }
async function pressUp() {
  if (homeWin >= 0) { const i = homeWin; homeWin = -1; FX.press = -1; showWin(i); pulse(i, .8, 500); const p = planOf(cur)[i]; return said(i, 'window', { fact: p.fact.kind, text: p.fact.big }) }
  const p = pressing; if (!p || !p.held) return; p.held = false
  if (performance.now() - p.t0 < num('press-tap-ms', 260)) { const from = p.d, ms = num('press-ms', 1100) * (1 - from), t0 = performance.now()
    await new Promise(r => { const f = () => { if (pressing !== p) return r(); p.d = from + (1 - from) * Math.min(1, (performance.now() - t0) / ms); if (p.d >= 1) r(); else requestAnimationFrame(f) }; requestAnimationFrame(f); setTimeout(r, ms + 400) })
    return giveWay(p) }
  const from = p.d, t0 = performance.now()
  await new Promise(r => { const f = () => { p.d = from * (1 - Math.min(1, (performance.now() - t0) / 500)); if (p.d <= 0) r(); else requestAnimationFrame(f) }; requestAnimationFrame(f); setTimeout(r, 900) })
  p.d = 0; await p.ready; drop(p.next); pressing = null; busy = false; at('stone'); S28.expect = null }
async function giveWay(p) { if (p.gave) return; p.gave = true; p.held = false; p.d = 1
  await p.ready
  const ms = num('fall-ms', 900), t0 = performance.now()
  await new Promise(r => { const f = () => { const u = Math.min(1, (performance.now() - t0) / ms); p.gv = u * u; if (u >= 1) r(); else requestAnimationFrame(f) }; requestAnimationFrame(f); setTimeout(r, ms + 400) })

function landed(next, old, delay) {
  drop(old); show(next); busy = false; at('world'); next.mode = 'world'
  history.pushState({ trail: next.trail, word: next.word || null, from: next.from || null }, '', qs({ w: next.key }))
  S28.trail = next.trail.slice()
  if (delay != null) arrive(next, delay) }

/* through (22 c): the next world is first seen through the gem, each facet bending it its own way, light split at the edges;
   a facet's crossing grows from that facet, the next photograph's answering region lying in it, then everything comes true and the cut settles */
async function cross(d, pt0, fi) {
  if (busy || !cur || cur.mode !== 'world') return
  busy = true; at('entering'); S28.expect = keyOf(d.to); S28.word = d.word
  const old = cur, pt = pt0 || (() => { const b = d.el.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2] })()
  hideWin(); FX.hover = FX.press = -1
  if (fi == null && F === 'd') { const j = planOf(old).findIndex(p => p && p.k === d.k); if (j >= 0) fi = j } // joined: a door line carries its facet with it
  old.v.classList.add('gone'); old.run = -1
  const next = await makeWorld({ ...d.to, word: d.word || null, from: { phrase: d.phrase || null, title: old.poem.title } }, 'world', old.trail)
  if (reduce()) return calmTo(next, d.word)
  const ms = num('through-ms', 2700), r = rng(hash(old.key + next.key))
  const C = crossing = { old, next, pt, ms, pair: match(old.sites, next.sites), rand: old.sites.map(() => r()), far: Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(q => Math.hypot(q[0] - pt[0], q[1] - pt[1]))), t0: performance.now(),
    align: fi != null ? alignOf(old, fi, next) : null }
  S28.align = C.align && { c: C.align.c, r: C.align.r }
  named(d.word, ms, old.cents[0])
  arrive(next, ms * num('through-arrive', .8))

const reach = (C, c) => Math.hypot(c[0] - C.pt[0], c[1] - C.pt[1]) / C.far
function geo(C, s) { const key = Math.round(s * 400); if (C.geoKey === key) return C.geoV
  const S = C.old.sites.map((a, i) => { const b = C.next.sites[C.pair[i]]; return [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s] })
  const N = C.old.normals.map((a, i) => { const b = C.next.normals[C.pair[i]]; return [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s] })

    const z = 1 + k * (.5 + C.rand[i] * .6), [b0, b1, b2, b3] = bbox(P), lim = (v, lo, hi) => Math.max(lo, Math.min(hi, v)) // the lens never pulls the picture off its own facet

    facet(P, c, n, [{ img: C.old.img, alpha: 1 - a * (1 - relax * .25) }, { img: C.next.img, alpha: a, m: mul(m, Am) }, ...textLayer(C.old, i, n, P, fade), ...textLayer(C.next, i, n, P)],

// the calm crossing: reduced motion's only move, a crossfade
async function calmTo(next, word) {
  busy = true; at('entering'); const old = cur, ms = num('calm-ms', 1100)

  await sleep(ms + 40); if (crossing === C) crossing = null

function named(word, ms, at0) { // how much of the idea a visitor sees: ?name=never | crossing (only while crossing) | door (beside each door line)
  if (NAME !== 'crossing' || !word) return
  ideaEl.textContent = word
  const x = Math.max(120, Math.min(W - 120, phone() ? W / 2 : at0[0])), y = Math.max(80, Math.min(H - 160, phone() ? H * .22 : at0[1]))
  Object.assign(ideaEl.style, { left: x + 'px', top: y + 'px' })
  const A = num('idea-alpha', .82)
  ideaEl.animate(reduce() ? [{ opacity: 0 }, { opacity: A, offset: .3 }, { opacity: A, offset: .7 }, { opacity: 0 }]
    : [{ opacity: 0, transform: 'translate(-50%,-50%) scale(.96)' }, { opacity: A, offset: .22 }, { opacity: A, offset: .62 }, { opacity: 0, transform: 'translate(-50%,-50%) scale(1.03)' }], { duration: ms, easing: 'cubic-bezier(.4,0,.2,1)' }) }

/* ---------- the loop ---------- */
let last = performance.now()
function frame(now) {
  const dt = Math.min(100, now - last); last = now
  if (!reduce() && now - lastMove > 4000 && !S28.still) { const a = now / 26000; Tx = W * (.5 + .38 * Math.cos(a)); Ty = H * (.42 + .3 * Math.sin(a * 1.3)) } // unattended, the sun walks
  Lx += (Tx - Lx) * .05; Ly += (Ty - Ly) * .05
  const k = 1 - Math.exp(-dt / Math.max(1, num('line-ms', 320) * .66))
  for (const w of [...live(), crossing && crossing.old].filter(Boolean)) { w.A.forEach((a, i) => { const b = a + (w.Tg[i] - a) * k; if (Math.abs(b - a) > .001) { w.A[i] = Math.abs(w.Tg[i] - b) < .004 ? w.Tg[i] : b; w.dirty = true } }); if (w.dirty) composite(w) }

  const C = crossing
  if (pressing && pressing.d + pressing.gv > 0) { const p = pressing
    if (p.next) drawWorld(p.next)
    const pose = pressPose(p, io(p.d), p.gv)
    p.old.cells.forEach((P, i) => facet(P, p.old.cents[i], p.old.normals[i], [{ img: p.old.img }, ...textLayer(p.old, i, p.old.normals[i], P, 1 - p.d)], pose[i])) }
  else if (C && C.calm) { const t = io(clamp01((now - C.t0) / C.ms)); drawWorld(C.old, { text: 1 - t }); drawWorld(C.next, { alpha: t }) }
  else if (C) drawThrough(C, clamp01((now - C.t0) / C.ms))

  const k = 1 - Math.exp(-dt / 90); for (let i = 0; i < w.lv.length; i++) w.lv[i] += (liftOf(w, i, now) - w.lv[i]) * k
  FX.pulses = FX.pulses.filter(p => now - p.t0 < p.ms) }

/* ---------- input ---------- */
app.addEventListener('pointerdown', e => {
  if (e.button > 0 || e.target.closest('header,a,button') || !cur || cur.mode !== 'home' || busy) return
  pressStart([e.clientX, e.clientY]); try { app.setPointerCapture(e.pointerId) } catch {} })
app.addEventListener('pointerup', () => pressUp()); app.addEventListener('pointercancel', () => { homeWin = -1; FX.press = -1; pressUp() })
app.addEventListener('click', e => { // doors are links for keys and for reading; a pointer is routed on its way up, below
  const a = e.target.closest('.verse .door'); if (!a) return
  e.preventDefault(); if (e.detail !== 0 || busy || !cur || cur.mode !== 'world') return // mid-way, a second touch goes nowhere
  const d = cur.doors.find(d => d.el === a); if (d && a.closest('.l.shown')) cross(d) })
let down = null
const own = t => t && t.closest && t.closest('header a, header nav, .verse h2 a')
app.addEventListener('pointerdown', e => {
  if (e.button > 0 || !cur || cur.mode !== 'world' || busy || own(e.target)) return
  down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; FX.press = doorAt(e.clientX, e.clientY) ? -1 : facetAt(e.clientX, e.clientY) })
addEventListener('pointerup', e => { if (cur && cur.mode === 'world') FX.press = -1; const dn = down; down = null
  if (!dn || dn.id !== e.pointerId || Math.hypot(e.clientX - dn.x, e.clientY - dn.y) > 12 || performance.now() - dn.t > 900) return
  route(e.clientX, e.clientY) })
addEventListener('pointercancel', () => { FX.press = -1; down = null })
function route(x, y) {
  if (busy || !cur || cur.mode !== 'world') return
  const d = doorAt(x, y); if (d) return cross(d) // a door line wins over the facet beneath it
  const i = facetAt(x, y); if (i >= 0) facetTap(i) }
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || !cur || busy) { FX.hover = -1; app.classList.remove('over'); return }
  if (cur.mode !== 'world') { FX.hover = -1; return }
  const d = doorAt(e.clientX, e.clientY), i = d || own(e.target) ? -1 : facetAt(e.clientX, e.clientY)
  FX.hover = i; app.classList.toggle('over', !!d || i >= 0)
  const p = F === 'd' && i >= 0 ? planOf(cur)[i] : null, k = d ? d.k : p && p.k != null ? String(p.k) : null // joined: a door's facet lights its line, and its line its facet
  if (F === 'd') FX.hover = i >= 0 ? i : d ? planOf(cur).findIndex(q => q && String(q.k) === String(d.k)) : -1
  if (cur.lit !== k && (d || p || !e.target.closest('.door'))) { cur.lit = k; cur.dirty = true } })
addEventListener('keydown', e => {
  if (!cur || cur.mode !== 'home' || busy || e.target.closest?.('a,button,input')) return
  if (['Enter', ' '].includes(e.key)) { e.preventDefault(); pressStart([W / 2, H / 2]).then(() => pressUp()) } })
addEventListener('popstate', () => location.reload())

/* ---------- begin: today's stone, or the world in the address ---------- */
const lum = (d, k) => (d[k] * .2126 + d[k + 1] * .7152 + d[k + 2] * .0722) / 255
window.S28 = { vocab: VOCAB, name: NAME, f: F, expect: null, word: null, trail: [], dry: false, still: false, align: null,
  get last() { return FX.last }, get seq() { return FX.seq },
  get win() { return FX.win && { i: FX.win.i, text: backEl.textContent, kind: FX.win.fact.kind, opacity: +backEl.style.opacity } },
  get drawn() { return cur ? drawn(cur) : [] },
  get today() { const R = todayRanks(); return R && { how: ctx.how, poems: R.poems.slice(0, 10), photos: R.photos.slice(0, 10) } },
  plan(i) { const p = cur && planOf(cur)[i]; return p ? p.kind === 'door' ? { kind: 'door', to: keyOf(p.to), how: p.how, k: p.k ?? null } : { kind: 'window', fact: p.fact.kind, text: p.fact.big } : null },
  get plans() { return cur ? planOf(cur).map((p, i) => p && this.plan(i)) : [] },
  tapPoint(i) { return cur ? touchAt(cur, i) : null },
  async rest(o = {}) { // every facet, as drawn now, against this photograph and against the one it leads to: the closer must be this one (pixels, not code)
    const w = cur, P = planOf(w), st = g.getImageData(0, 0, cv.width, cv.height).data, own = w.img.getContext('2d').getImageData(0, 0, cv.width, cv.height).data, other = {}
    const foreign = async p => { const src = p && p.kind === 'door' ? p.to.photo.src : (w.doors[0] ? w.doors[0].to.photo.src : data.photos.find(q => q.src !== w.photo.src).src)
      return other[src] ||= (await photo(photoBy(src))).getContext('2d').getImageData(0, 0, cv.width, cv.height).data }
    const skip = [w.R && [w.R[0] - 30, w.R[1] - 20, w.R[2] + 60, w.R[3] + 40], ...['#mat', '#cap', '.vs', '#back'].map(q => { const r = document.querySelector(q).getBoundingClientRect(); return [r.left - 10, r.top - 10, r.width + 20, r.height + 20] })].filter(Boolean)
    const fit = (s, o2) => { const n = s.length; let ms = 0, mo = 0; for (let k = 0; k < n; k++) { ms += s[k]; mo += o2[k] } ms /= n; mo /= n; let so = 0, oo = 0; for (let k = 0; k < n; k++) { so += (s[k] - ms) * (o2[k] - mo); oo += (o2[k] - mo) ** 2 }
      const b = oo ? so / oo : 0; let e = 0; for (let k = 0; k < n; k++) e += Math.abs(s[k] - ms - b * (o2[k] - mo)); return e / n } // what is left after the best light (a scale and a shift): the lamp changes light, never content
    const out = []
    for (const i of drawn(w)) { const Q = inset(w.cells[i], 9); if (Q.length < 3) continue; const [x0, y0, x1, y1] = bbox(Q), S0 = [], O0 = [], F0 = [], fo = await foreign(P[i])
      for (let y = Math.ceil(y0); y < y1; y += 5) for (let x = Math.ceil(x0); x < x1; x += 5) { if (!inPoly([x, y], Q) || skip.some(([l, t, ww, hh]) => x >= l && x <= l + ww && y >= t && y <= t + hh)) continue
        const k = (Math.round(y * DPR) * cv.width + Math.round(x * DPR)) * 4; S0.push(lum(st, k)); O0.push(lum(own, k)); F0.push(lum(fo, k)) }
      if (S0.length < 12) continue
      out.push({ i, n: S0.length, own: +fit(S0, O0).toFixed(4), other: +fit(S0, F0).toFixed(4) }) }
    return out },
  get at() { return document.body.dataset.at }, get busy() { return busy }, get t() { return crossing && !crossing.calm ? clamp01((performance.now() - crossing.t0) / crossing.ms) : null },
  get world() { return cur && { key: cur.key, slug: cur.poem.slug, title: cur.poem.title, photo: cur.photo.src, mode: cur.mode, imgOk: !!cur.img.ok, arrived: !!cur.arrived } },
  get doors() { return cur ? cur.doors.map(d => ({ k: d.k, phrase: d.phrase, word: d.word, text: d.el.textContent, line: d.el.closest('.l').textContent, to: keyOf(d.to), how: d.to.how, phow: d.to.phow,
    box: (() => { const b = d.el.getClientRects()[0] || d.el.getBoundingClientRect(); return [b.left, b.top, b.width, b.height] })() })) : [] },
  get lines() { return cur ? cur.lines.slice(1).map((l, i) => ({ door: 'door' in l.dataset, shown: cur.Tg[i + 1] === 1, a: cur.A[i + 1], open: (() => { const a = l.querySelector('.door'); return a ? getComputedStyle(a).pointerEvents !== 'none' : null })() })) : [] },
  get facets() { return cur ? cur.cells.filter(P => P.length > 2).length : 0 },
  read() { const w = 96, h = Math.round(96 * H / W), c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(cv, 0, 0, w, h)
    const p = x.getImageData(0, 0, w, h).data; let s = 0, dark = 0, n = w * h; for (let i = 0; i < p.length; i += 4) { const l = (p[i] * .2126 + p[i + 1] * .7152 + p[i + 2] * .0722) / 255; s += l; if (l < .06) dark++ } return { mean: s / n, bare: dark / n } } }
const direct = pairOf(Q.get('w')), hs = history.state || {}
if (direct) { const tr0 = (hs.trail || []).filter(k => k !== keyOf(direct)); const w = await makeWorld({ ...direct, word: hs.word || null, from: hs.from || null }, 'world', tr0); show(w); at('world'); S28.trail = w.trail.slice(); arrive(w, num('arrive-delay-ms', 500)) }
else { const w = await makeWorld({ poem: ctx.poem, photo: ctx.photo }, 'home', []); show(w); at('stone'); S28.trail = w.trail.slice(); w.lines.forEach((l, i) => { w.Tg[i] = w.A[i] = 1; l.classList.add('shown') }); w.dirty = true; warm(w) }
requestAnimationFrame(frame)
let rz = 0, lastWH = innerWidth + 'x' + innerHeight
const rebuild = async () => { if (busy) return; size(); prepared.clear(); const o = cur, w = await makeWorld({ poem: o.poem, photo: o.photo, word: o.word, from: o.from }, o.mode, o.trail.slice(0, -1)); drop(o); show(w)
  w.lines.forEach((l, i) => { w.Tg[i] = w.A[i] = 1; l.classList.add('shown') }); w.arrived = true; w.dirty = true }
addEventListener('resize', () => { const wh = innerWidth + 'x' + innerHeight; if (wh === lastWH) return; lastWH = wh; clearTimeout(rz); rz = setTimeout(rebuild, 250) })
document.addEventListener('s28:tune', rebuild)
document.body.dataset.ready = 'yes'
