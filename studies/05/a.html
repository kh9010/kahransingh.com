<style>
:root { --ink: #f4f1ea; --ink2: rgba(244,241,234,.66); --ink3: rgba(244,241,234,.42); --top: #1c2140; --bottom: #3a3a5c;
  --sans: 'Space Grotesk', -apple-system, sans-serif; --serif: 'Fraunces', Georgia, serif; --ease: cubic-bezier(.4,0,.2,1); }
:root[data-ink="dark"] { --ink: #1a1a1a; --ink2: rgba(26,26,26,.62); --ink3: rgba(26,26,26,.4); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }

/* the sun-glint: a small star of light that skitters over the words */

.glint::before, .glint::after { content: ''; position: absolute; inset: 0; }

  linear-gradient(90deg, transparent 0, rgba(255,250,235,.0) 10%, rgba(255,250,235,.85) 50%, rgba(255,250,235,0) 90%, transparent) center / 100% 1.5px no-repeat,

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

const Q = new URLSearchParams(location.search)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

// ---------- the sky: live hour + cloud + rain → two colours ----------
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t)
const STOPS = [[0, [14, 18, 40], [34, 36, 64]], [5, [44, 46, 84], [206, 146, 128]], [7, [132, 168, 210], [246, 216, 182]],
  [12, [118, 160, 206], [214, 228, 238]], [17, [88, 118, 176], [238, 196, 150]], [19, [56, 56, 104], [214, 132, 112]], [21, [20, 24, 52], [46, 48, 82]], [24, [14, 18, 40], [34, 36, 64]]]
function sky(r) {
  const tz = (r && r.tz) || 'America/New_York'
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date())
  let hour = +p.find(x => x.type === 'hour').value + +p.find(x => x.type === 'minute').value / 60
  if (Q.has('hour')) hour = +Q.get('hour')
  let i = STOPS.findIndex(s => s[0] > hour) - 1; if (i < 0) i = 0
  const [h0, t0, b0] = STOPS[i], [h1, t1, b1] = STOPS[i + 1], t = (hour - h0) / (h1 - h0)
  let top = mix(t0, t1, t), bottom = mix(b0, b1, t)
  const cloud = r ? (r.cloud_cover || 0) / 100 : .3, wet = r && r.weather_code >= 51
  top = mix(top, [118, 124, 134], cloud * .45); bottom = mix(bottom, [168, 170, 174], cloud * .4)
  if (wet) { top = mix(top, [42, 48, 58], .3); bottom = mix(bottom, [92, 98, 106], .3) }
  return { top, bottom, hour }
}
const css = c => `rgb(${c.map(Math.round).join(',')})`
const lum = c => (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) / 255

// ---------- renderer ----------
const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.outputColorSpace = THREE.LinearSRGBColorSpace   // shaders below work in display space
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100)
camera.position.set(0, 0, 10)

// a studio: RoomEnvironment's softboxes baked once into a cube map the glass reflects
const envRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter })
const cubeCam = new THREE.CubeCamera(.1, 100, envRT)
const room = new RoomEnvironment()
cubeCam.update(renderer, room)

// ---------- the field: sky, a soft shadow, caustics, the thrown spectra ----------
const NB = 6
const fieldU = {
  res: { value: new THREE.Vector2(1, 1) }, top: { value: new THREE.Vector3(.1, .12, .25) }, bot: { value: new THREE.Vector3(.2, .2, .35) },
  cpos: { value: new THREE.Vector2(.6, .55) }, crad: { value: .12 }, time: { value: 0 },
  beams: { value: Array.from({ length: NB }, () => new THREE.Vector4()) }, night: { value: 0 }
}
const field = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: fieldU, depthWrite: false, depthTest: false,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `
  uniform vec2 res; uniform vec3 top, bot; uniform vec2 cpos; uniform float crad, time, night; uniform vec4 beams[${NB}];
  float h21(vec2 p){ p = fract(p*vec2(233.34, 851.73)); p += dot(p, p+23.45); return fract(p.x*p.y); }
  vec3 spectrum(float x){ // soft physical-ish rainbow, 0 = violet … 1 = red
    x = clamp(x, 0., 1.);
    vec3 c = vec3(smoothstep(.45, .85, x) + .35*smoothstep(.2, 0., x), 1. - abs(x - .55)*2.4, 1. - smoothstep(.15, .5, x));
    return clamp(c, 0., 1.) * smoothstep(0., .12, x) * smoothstep(1., .86, x);
  }
  float caust(vec2 p, float t){ // a few interfering waves, sharpened
    float v = 0.;
    for (int i = 0; i < 4; i++){ float a = float(i)*1.7 + t*.11*(1.+float(i)*.3); v += sin(dot(p, vec2(cos(a), sin(a)))*(9. + float(i)*3.) + t*(.4+.1*float(i))); }
    return pow(abs(v)*.25, .5);
  }
  void main(){
    vec2 uv = gl_FragCoord.xy/res; float asp = res.x/res.y;
    vec3 col = mix(bot, top, smoothstep(-.05, 1.05, uv.y));
    // a breath of light behind the crystal
    vec2 q = (uv - cpos)*vec2(asp, 1.);
    col += (top*.25 + vec3(.05)) * exp(-dot(q,q)/(crad*crad*9.)) * .55;
    // the shadow it casts, down and to the right of a key light at upper left
    vec2 sc = cpos + vec2(.07/asp, -.30);
    vec2 s = (uv - sc)*vec2(asp, 1.); s.y *= 2.3;
    float sh = exp(-dot(s,s)/(crad*crad*1.6));
    col *= 1. - sh*.16;
    // caustic: light gathered by the glass into the middle of its shadow
    float cz = exp(-dot(s,s)/(crad*crad*.35));
    col += vec3(1., .95, .86) * cz * (.05 + .05*caust(s*2., time)) * (1. - night*.4);
    // the spectra: short soft bars of colour thrown onto the field, as a crystal in a window does to a wall
    for (int i = 0; i < ${NB}; i++){
      vec4 b = beams[i]; if (b.y < .002) continue;
      vec2 dir = vec2(cos(b.x), sin(b.x)); vec2 per = vec2(-dir.y, dir.x);
      vec2 p = (uv - sc)*vec2(asp, 1.) - dir*b.z;
      float along = dot(p, dir)/b.w, across = dot(p, per)/(b.w*.24);
      float body = exp(-across*across*1.6) * smoothstep(1.15, .7, abs(along));
      float shimmer = .9 + .1*sin(along*9. - time*.5 + float(i)*2.);
      vec3 sp = spectrum(along*.5 + .5); sp = mix(sp, vec3(dot(sp, vec3(.333))), mix(.12, .4, night));
      col += sp * body * b.y * shimmer * mix(.42, .2, night);
    }
    // vignette + grain, so the field has a surface
    vec2 v = (uv - .5)*vec2(asp, 1.); col *= 1. - dot(v,v)*.12;
    col += (h21(gl_FragCoord.xy + fract(time)*91.) - .5) * .018;
    gl_FragColor = vec4(col, 1.);
  }`
}))
field.frustumCulled = false; field.renderOrder = -1
scene.add(field)

// ---------- the crystal: a quartz point, slightly irregular ----------
// side facets look into one cell each of an atlas (photographs, a poem line, the place);
// the terminations are clear glass that see the sky.
function crystalGeometry() {
  const n = 6, R = 1, H = .95, T1 = 2.05, T2 = 1.55
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 - .5
  const top = [], bot = []
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + rnd() * .12, r = R * (1 + rnd() * .14)
    top.push(new THREE.Vector3(Math.cos(a) * r, H + rnd() * .25, Math.sin(a) * r))
    bot.push(new THREE.Vector3(Math.cos(a) * r * .96, -H + rnd() * .25, Math.sin(a) * r * .96))
  }
  const apT = new THREE.Vector3(rnd() * .2, T1, rnd() * .2), apB = new THREE.Vector3(rnd() * .2, -T2, rnd() * .2)
  const P = [], B = [], C = [], CEN = [], NRM = [], SC = []
  function tri(a, b, c, cell, cen, nrm, scale, skip) {
    P.push(a, b, c)
    const bs = [[1, 0, 0], [0, 1, 0], [0, 0, 1]]
    if (skip >= 0) bs.forEach(v => v[skip] += 1)   // hide the diagonal of a quad
    B.push(...bs); for (let k = 0; k < 3; k++) { C.push(cell); CEN.push(cen); NRM.push(nrm); SC.push(scale) }
  }
  const cells = [0, 1, 2, 3, 4, 5]
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, a = bot[i], b = bot[j], c = top[j], d = top[i]
    const cen = a.clone().add(b).add(c).add(d).multiplyScalar(.25)
    const nrm = new THREE.Vector3().crossVectors(c.clone().sub(a), b.clone().sub(a)).normalize()
    if (nrm.dot(cen) < 0) nrm.negate()
    const sc = a.distanceTo(b) * .5 + .4
    // quad a b c d as (a,b,c) + (a,c,d); the shared edge a–c is opposite b in the first, d in the second
    tri(a, c, b, cells[i], cen, nrm, sc, 2); tri(a, d, c, cells[i], cen, nrm, sc, 1)
  }
  for (const [ring, ap] of [[top, apT], [bot, apB]]) for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, a = ring[i], b = ring[j]
    const cen = a.clone().add(b).add(ap).multiplyScalar(1 / 3)
    const nrm = new THREE.Vector3().crossVectors(b.clone().sub(a), ap.clone().sub(a)).normalize()
    if (nrm.dot(cen) < 0) nrm.negate()
    tri(a, b, ap, -1 - ((i + (ring === top ? 2 : 5)) % n), cen, nrm, 1.1, -1)   // a termination glimpses a neighbour, bent hard
  }
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(P.flatMap(v => [v.x, v.y, v.z]), 3))
  g.setAttribute('bary', new THREE.Float32BufferAttribute(B.flat(), 3))
  g.setAttribute('cell', new THREE.Float32BufferAttribute(C, 1))
  g.setAttribute('fcen', new THREE.Float32BufferAttribute(CEN.flatMap(v => [v.x, v.y, v.z]), 3))
  g.setAttribute('fnrm', new THREE.Float32BufferAttribute(NRM.flatMap(v => [v.x, v.y, v.z]), 3))
  g.setAttribute('fsc', new THREE.Float32BufferAttribute(SC, 1))
  g.userData.sideNormals = Array.from({ length: n }, (_, i) => new THREE.Vector3(...NRM[i * 6].toArray()))
  return g
}

const ATLAS_W = 3, ATLAS_H = 2, CELL = 1024
const atlasCanvas = document.createElement('canvas'); atlasCanvas.width = CELL * ATLAS_W; atlasCanvas.height = CELL * ATLAS_H
const atlas = new THREE.CanvasTexture(atlasCanvas); atlas.generateMipmaps = true; atlas.minFilter = THREE.LinearMipmapLinearFilter; atlas.anisotropy = 8

const glassU = {
  atlas: { value: atlas }, env: { value: envRT.texture }, top: fieldU.top, bot: fieldU.bot, time: fieldU.time,
  res: fieldU.res, hot: { value: -1 }, hotAmt: { value: 0 }, keyDir: { value: new THREE.Vector3(-.55, .7, .45).normalize() }, night: fieldU.night
}
const glass = new THREE.Mesh(crystalGeometry(), new THREE.ShaderMaterial({
  uniforms: glassU, transparent: true,
  vertexShader: `
  attribute vec3 bary, fcen, fnrm; attribute float cell, fsc;
  varying vec3 vB, vPV, vCV, vNV, vNW, vPW; varying float vCell, vSc;
  void main(){
    vB = bary; vCell = cell; vSc = fsc;
    vec4 pv = modelViewMatrix*vec4(position,1.); vPV = pv.xyz;
    vCV = (modelViewMatrix*vec4(fcen,1.)).xyz;
    vNV = normalize(normalMatrix*fnrm);
    vNW = normalize(mat3(modelMatrix)*fnrm);
    vPW = (modelMatrix*vec4(position,1.)).xyz;
    gl_Position = projectionMatrix*pv;
  }`,
  fragmentShader: `
  uniform sampler2D atlas; uniform samplerCube env; uniform vec3 top, bot, keyDir; uniform float time, hot, hotAmt, night; uniform vec2 res;
  vec3 behind(vec2 o){ float y = gl_FragCoord.y/res.y + o.y; return mix(bot, top, smoothstep(-.05, 1.05, y)); }   // the field directly behind, displaced
  varying vec3 vB, vPV, vCV, vNV, vNW, vPW; varying float vCell, vSc;
  vec3 skyAt(vec3 d){ return mix(bot, top, smoothstep(-.6, .8, d.y)); }
  vec2 mirror(vec2 u){ return 1. - abs(1. - mod(u, 2.)); }
  vec3 cellTap(vec2 u, float c){
    vec2 o = vec2(mod(c, 3.), floor(c/3.));
    u = clamp(u, .01, .99);
    return texture2D(atlas, (o + u)/vec2(3., 2.)).rgb;
  }
  void main(){
    vec3 N = normalize(vNV), V = normalize(-vPV);
    float facing = clamp(dot(N, V), 0., 1.);
    float F = .04 + .96*pow(1. - facing, 5.);
    // dispersion: each channel bends by its own index
    vec3 iors = vec3(1.47, 1.5, 1.535);
    vec3 rr = refract(-V, N, 1./iors.r), rg = refract(-V, N, 1./iors.g), rb = refract(-V, N, 1./iors.b);
    vec3 body;
    if (vCell >= 0.){
      vec2 base = (vPV.xy - vCV.xy)/vSc*.5 + .5;
      float k = .5;
      vec3 c = vec3(cellTap(base + rr.xy*k, vCell).r, cellTap(base + rg.xy*k, vCell).g, cellTap(base + rb.xy*k, vCell).b);
      vec2 eu = base + rg.xy*k; vec2 ed = min(eu, 1. - eu);
      float edge = smoothstep(-.02, .14, min(ed.x, ed.y));          // the image fades into the glass at its borders
      float win = smoothstep(.15, .8, facing) * edge;
      vec3 clear = behind(rg.xy*.22)*1.08 + textureCube(env, rg).rgb*.06;
      body = mix(clear, c*1.1 + .02, win*.95);
      body += (hot == vCell ? 1. : 0.) * hotAmt * .06;
    } else {
      // clear glass: the field seen through it, split by dispersion, and a neighbour's picture caught inside, bent hard
      float cc = -vCell - 1.;
      vec2 base = (vPV.xy - vCV.xy)/vSc*.35 + .5;
      vec3 ghost = vec3(cellTap(base + rr.xy*.4, cc).r, cellTap(base + rg.xy*.4, cc).g, cellTap(base + rb.xy*.4, cc).b);
      // transmission: the field behind, displaced per channel; and the same field flipped by an internal bounce
      vec3 thru = vec3(behind(rr.xy*.22).r, behind(rg.xy*.22).g, behind(rb.xy*.22).b);
      vec3 bounce = behind(-rg.xy*.5 + vec2(0., .25));
      vec3 clear = mix(thru, bounce, .35 + .25*sin(dot(vPV.xy, vec2(3.1, -2.3)) + facing*5.))*1.1 + textureCube(env, rg).rgb*.06;
      body = mix(clear, ghost*1.1 + .04, .4*smoothstep(.1, .7, facing)) * (.9 + .2*vB.z);
    }
    // the studio, reflected: the sky is the room, the softboxes are the highlights
    vec3 R = reflect(-normalize(cameraPosition - vPW), normalize(vNW));
    vec3 Rp = normalize(R*2.2 + vPW*.9);              // the room is near: reflections slide across a flat facet
    vec3 room = textureCube(env, Rp).rgb;
    float box = smoothstep(.72, 1.05, dot(room, vec3(.333)));
    vec3 refl = skyAt(Rp)*.85 + room*.14 + vec3(1., .98, .95)*box*.8;
    F = min(F, .62);
    vec3 col = body*(1. - F) + refl*F;
    // a key-light glint on each facet
    float spec = pow(max(dot(R, keyDir), 0.), 180.);
    col += vec3(1., .97, .92)*spec*1.6;
    // edges: thin bright lines with a rainbow fringe, as cut glass catches light at its arrises
    float e = min(min(vB.x, vB.y), vB.z);
    float fw = fwidth(e);
    float line = 1. - smoothstep(0., fw*1.4, e);
    float halo = 1. - smoothstep(0., fw*9., e);
    vec3 fringe = .55 + .45*cos(6.2832*(e/(fw*9.) + facing*1.3 + vec3(0., .33, .67)));
    col += line*(.22 + .3*F) + halo*fringe*.09;
    gl_FragColor = vec4(col, .97);
  }`
}))
const crystal = new THREE.Group(); crystal.add(glass); scene.add(crystal)
const sideN = glass.geometry.userData.sideNormals

// ---------- content into the atlas ----------
const facetLinks = ['/photography.html', '/poetry.html', '/context/', '/photography.html', '/poetry.html', '/photography.html']
function img(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src }) }
function cover(g, im, x, y, w, h) {
  const s = Math.max(w / im.width, h / im.height), iw = im.width * s, ih = im.height * s
  g.drawImage(im, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih)
}
function wrap(g, text, x, y, maxW, lh) {
  const words = text.split(/\s+/), lines = []; let cur = ''
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w } else cur = t }
  lines.push(cur); lines.forEach((l, i) => g.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh))
}
function poemLines(q) { return q.stanzas.join('\n').split(/\n| \/ /).map(s => s.trim()).filter(s => s.length > 14 && s.length < 64 && s.toLowerCase() !== q.title.toLowerCase()) }
async function paint(ctx, sk) {
  const g = atlasCanvas.getContext('2d')
  await document.fonts.load('italic 300 80px Fraunces'); await document.fonts.load('400 40px "Space Grotesk"')
  const photos = [ctx.photo]
  const rest = ctx.data.photos.filter(p => p !== ctx.photo)
  const h = S03.hash(ctx.iso)
  photos.push(rest[h % rest.length], rest[(h >> 8) % rest.length === h % rest.length ? (h + 1) % rest.length : (h >> 8) % rest.length])
  const ims = await Promise.all(photos.map(p => img(p.src)))
  const deep = mix(sk.bottom, [16, 18, 30], .42), deep2 = mix(sk.top, [12, 14, 26], .38)
  const ground = (x, y) => { const gr = g.createLinearGradient(x, y, x, y + CELL); gr.addColorStop(0, css(deep2)); gr.addColorStop(1, css(deep)); g.fillStyle = gr; g.fillRect(x, y, CELL, CELL) }
  const at = i => [(i % 3) * CELL, Math.floor(i / 3) * CELL]
  // 0, 3, 5: photographs
  ;[[0, 0], [3, 1], [5, 2]].forEach(([c, k]) => { const [x, y] = at(c); ground(x, y); if (ims[k]) cover(g, ims[k], x, y, CELL, CELL) })
  // 1, 4: poem lines
  const q2 = ctx.data.poems.filter(p => p !== ctx.poem)[h % (ctx.data.poems.length - 1)]
  ;[[1, ctx.poem], [4, q2]].forEach(([c, q]) => {
    const [x, y] = at(c); ground(x, y)
    const L = poemLines(q); const line = L[0] || q.title
    g.fillStyle = 'rgba(250,246,236,.94)'; g.textAlign = 'center'; g.textBaseline = 'middle'
    g.font = 'italic 300 74px Fraunces'; wrap(g, line, x + CELL / 2, y + CELL / 2 - 20, CELL * .6, 90)
    g.font = '400 30px "Space Grotesk"'; g.fillStyle = 'rgba(250,246,236,.5)'; g.fillText(q.title.toLowerCase(), x + CELL / 2, y + CELL * .84)
  })
  // 2: his place and its weather, set in the sky's own colours
  { const [x, y] = at(2); const gr = g.createLinearGradient(x, y, x, y + CELL); gr.addColorStop(0, css(mix(sk.top, [255, 255, 255], .08))); gr.addColorStop(1, css(mix(sk.bottom, [255, 255, 255], .12))); g.fillStyle = gr; g.fillRect(x, y, CELL, CELL)
    const r = ctx.reading, place = r && r.place || 'New York'
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = lum(sk.bottom) > .55 ? 'rgba(20,20,24,.9)' : 'rgba(250,246,236,.95)'
    g.font = '300 150px Fraunces'; g.fillText(r ? Math.round(r.temperature_2m) + '°' : '', x + CELL / 2, y + CELL * .4)
    g.font = 'italic 300 76px Fraunces'; g.fillText(place, x + CELL / 2, y + CELL * .6)
    g.font = '400 30px "Space Grotesk"'; g.globalAlpha = .6; g.fillText((ctx.line || '').replace(/^.*?(and|,)\s*/i, '').replace(/\.$/, '').toLowerCase(), x + CELL / 2, y + CELL * .74); g.globalAlpha = 1 }
  atlas.needsUpdate = true
}

// ---------- layout ----------
const floor = document.getElementById('floor'), where = document.getElementById('where')
let W = 1, H = 1
function layout() {
  W = innerWidth; H = innerHeight
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix()
  fieldU.res.value.set(W * renderer.getPixelRatio(), H * renderer.getPixelRatio())
  const narrow = W < 700
  // composition: the crystal sits right of centre and high; the words sit low-left in its light
  crystal.position.set(narrow ? 0 : 1.0 * Math.min(W / H, 1.8) / 1.6, narrow ? .55 : .3, 0)
  crystal.scale.setScalar(narrow ? .62 : .84)
}
addEventListener('resize', layout); layout()

// ---------- motion ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(9, 9), mouseS = { x: 0, y: 0 }
let over = -1, overSince = 0, lastGlint = -1e9, drag = null, spin = 0, spinV = 0
addEventListener('pointermove', e => {
  mouse.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1)
  if (drag) { spinV = (e.clientX - drag.x) * .004; spin += spinV; drag.x = e.clientX }
})
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, x0: e.clientX } })
addEventListener('pointerup', e => {
  if (drag && Math.abs(e.clientX - drag.x0) < 4 && over >= 0) location.href = facetLinks[over]
  drag = null
})
addEventListener('pointerleave', () => mouse.set(9, 9))

// the mischief: now and then a facet catches the cursor and throws a sun-glint across the words
const glintEl = document.getElementById('glint')
function glint(fromX, fromY) {
  const words = [...floor.querySelectorAll('h1 a, .line, nav a')]
  const t = words[0].getBoundingClientRect(), l = words[1].getBoundingClientRect()
  const pts = [[fromX, fromY]]
  const hop = (r, n) => { for (let i = 0; i < n; i++) pts.push([r.left + r.width * (.08 + .84 * (i / (n - 1))) + (Math.random() - .5) * 18, r.top + r.height * (.35 + Math.random() * .35)]) }
  hop(t, 4); hop(l, 3)
  const kf = pts.map(([x, y], i) => ({ transform: `translate(${x}px,${y}px) scale(${i === 0 ? .4 : .8 + Math.random() * .5}) rotate(${i * 23}deg)`, opacity: i === 0 ? 0 : i === pts.length - 1 ? 0 : .95 }))
  kf[1].opacity = 1
  const a = glintEl.animate(kf, { duration: 2400, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' })
  if (Q.has('glintAt')) { a.pause(); a.currentTime = 2400 * +Q.get('glintAt') }   // a still, for looking at it
}

const clock = new THREE.Clock(); let t = +(Q.get('t') || 0)
const tmpV = new THREE.Vector3(), Lkey = new THREE.Vector3(-.55, .7, .45).normalize()
function frame() {
  const dt = Math.min(clock.getDelta(), .05); t += reduce ? 0 : dt
  fieldU.time.value = t
  mouseS.x += ((mouse.x > 5 ? 0 : mouse.x) - mouseS.x) * .025; mouseS.y += ((mouse.y > 5 ? 0 : mouse.y) - mouseS.y) * .025
  if (!drag) { spinV *= .95; spin += spinV }
  // slow float: turn on the long axis, tilt and breathe
  crystal.rotation.set(.28 + Math.sin(t * .13) * .06 - mouseS.y * .12, 0, -.32 + Math.sin(t * .09) * .05)
  glass.rotation.y = t * .16 + spin + mouseS.x * .25
  glass.position.y = Math.sin(t * .45) * .06
  crystal.updateMatrixWorld(true)
  // hover: which facet is under the cursor
  ray.setFromCamera(mouse, camera)
  const hit = ray.intersectObject(glass)[0]
  const cell = hit ? glass.geometry.attributes.cell.getX(hit.face.a) : -1
  if (cell !== over) {
    over = cell; overSince = t; canvas.classList.toggle('over', cell >= 0)
    if (cell >= 0 && t - lastGlint > 18 && Math.random() < .2) { lastGlint = t; const p = hit.point.clone().project(camera); glint((p.x + 1) / 2 * W, (1 - p.y) / 2 * H) }
  }
  glassU.hot.value = over; glassU.hotAmt.value = Math.min(1, (t - overSince) * 2)
  // where the crystal sits on screen → the field's shadow and the light it throws
  tmpV.setFromMatrixPosition(crystal.matrixWorld).project(camera)
  fieldU.cpos.value.set((tmpV.x + 1) / 2, (tmpV.y + 1) / 2 + .02)
  fieldU.crad.value = .16 * crystal.scale.x
  // each side facet turned toward the key light throws a fan of colour down across the field
  const m3 = new THREE.Matrix3().getNormalMatrix(glass.matrixWorld)
  sideN.forEach((n, i) => {
    const w = n.clone().applyMatrix3(m3).normalize()
    const lit = Math.max(0, w.dot(Lkey) + .28)
    const ang = Math.PI * 1.25 + w.x * 1.6 + w.z * .7 + i * .21
    fieldU.beams.value[i].set(ang, Math.pow(lit, 2.4) * 1.2, .16 + .1 * (1 - Math.abs(w.y)) + .03 * (i % 3), .07 + .035 * (i % 2))
  })
  renderer.render(scene, camera)
  requestAnimationFrame(frame)
}

function applySky(sk) {
  const top = sk.top.map(v => v / 255), bot = sk.bottom.map(v => v / 255)
  fieldU.top.value.set(...top); fieldU.bot.value.set(...bot)
  fieldU.night.value = lum(sk.bottom) < .25 ? 1 : 0
  document.documentElement.style.setProperty('--top', css(sk.top)); document.documentElement.style.setProperty('--bottom', css(sk.bottom))
  document.documentElement.dataset.ink = lum(mix(sk.top, sk.bottom, .7)) > .62 ? 'dark' : 'light'
}
applySky(sky(null))
requestAnimationFrame(frame)
setTimeout(() => { floor.classList.add('on') }, 200)

S03.load().then(async ctx => {
  const sk = sky(ctx.reading); applySky(sk)
  where.textContent = (ctx.line || '').replace(/\s+/g, ' ').trim(); where.classList.add('on')
  await paint(ctx, sk)
  if (Q.has('glint')) setTimeout(() => { const p = tmpV.setFromMatrixPosition(crystal.matrixWorld).project(camera); lastGlint = t; glint((p.x + 1) / 2 * W, (1 - p.y) / 2 * H) }, +Q.get('glint') || 600)
})
</script>
