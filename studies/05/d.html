<!doctype html>
<html lang="en">
<head>

<title>Study 05 · D</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f4ef; --ink: #1a1a1a; --ink2: #6e6e6e; --ink3: #9a958c; --line: #e0ddd8;
  --glow: 220,214,200; --tint: 240,236,228;
  --sans: 'Space Grotesk', -apple-system, sans-serif; --serif: 'Fraunces', Georgia, serif;
  --ease: cubic-bezier(.4,0,.2,1);
  --D: min(68vh, 52vw);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font: 400 .78rem/1.45 var(--sans);
  overflow: hidden; transition: background 2.4s var(--ease);
  -webkit-font-smoothing: antialiased;
}
body::before { /* the page takes the photograph's light, very faintly */
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(circle closest-side at 50% 50%, rgba(var(--glow),.4), rgba(var(--tint),0) 100%);
  transition: background 2.4s var(--ease);
}
header { position: fixed; left: 40px; top: 36px; z-index: 3; }
header h1 { margin: 0; font: 500 .95rem var(--sans); letter-spacing: .01em; }
header h1 a { color: inherit; text-decoration: none; }
header p { margin: 4px 0 0; color: var(--ink2); }
nav { position: fixed; left: 40px; bottom: 36px; z-index: 3; display: flex; gap: 18px; }
nav a { color: var(--ink2); text-decoration: none; font-size: .72rem; letter-spacing: .12em; text-transform: lowercase; transition: color .2s var(--ease); }
nav a:hover { color: var(--ink); }
#sky { position: fixed; right: 40px; bottom: 36px; z-index: 3; color: var(--ink3); font-size: .72rem; letter-spacing: .04em; text-align: right; }

#scope { position: fixed; left: 50%; top: 50%; width: var(--D); height: var(--D); transform: translate(-50%,-50%); }
#lens {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(26,26,26,.06), 0 30px 80px -30px rgba(var(--glow),.9), 0 18px 50px -24px rgba(0,0,0,.28);
  background: rgb(var(--glow));
}
#lens canvas, #lens img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#lens img { object-fit: cover; }
#rim { position: absolute; inset: 0; pointer-events: none; }
#scope::after { /* the bezel: one hairline, a breath outside the glass */
  content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 1px solid rgba(26,26,26,.07); pointer-events: none; }
.facet {
  position: absolute; left: 50%; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
  pointer-events: auto; cursor: pointer; border: 0; padding: 0; background: none;
  transform: rotate(var(--a)) translateY(calc(var(--D) / -2 - 26px)) rotate(45deg);
  transition: transform .5s var(--ease), opacity .5s var(--ease);
  opacity: .5;
}
.facet i {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  box-shadow: 0 0 0 1px rgba(255,255,255,.8), 0 1px 4px -1px rgba(0,0,0,.2);
  filter: grayscale(1) contrast(.9);
  transition: transform .5s var(--ease), filter .5s var(--ease);
}
.facet:hover, .facet.on { opacity: 1; }
.facet:hover i { transform: scale(1.8); filter: none; }
.facet.on i { filter: none; }
.facet.on i { box-shadow: 0 0 0 1px rgba(26,26,26,.55), 0 2px 10px -2px rgba(0,0,0,.3); }
.facet:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

#verse {
  position: fixed; z-index: 3; top: 50%; left: calc(50% + var(--D) / 2 + 56px); right: 40px; max-width: 300px;
  transform: translateY(-50%); opacity: 0; transition: opacity 1.6s var(--ease), transform 1.6s var(--ease);
  pointer-events: none;
}
body.still #verse { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
#verse h2 { margin: 0 0 14px; font: italic 300 1.15rem/1.3 var(--serif); }
#verse .body { font: 300 .92rem/1.62 var(--serif); white-space: pre-line; color: #33302b; max-height: 52vh; overflow: hidden;
  -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); }
#verse .body.short { -webkit-mask-image: none; mask-image: none; }
#verse a { color: var(--ink2); font-size: .72rem; letter-spacing: .12em; text-decoration: none; display: inline-block; margin-top: 14px; }
#place {
  position: fixed; z-index: 3; top: 50%; right: calc(50% + var(--D) / 2 + 56px); width: 220px; text-align: right;
  transform: translateY(-50%); opacity: 0; transition: opacity 1.6s var(--ease); color: var(--ink2);
  font: italic 300 .86rem/1.5 var(--serif);
}
#place small { display: block; font: 400 .68rem var(--sans); letter-spacing: .12em; color: var(--ink3); font-style: normal; margin-top: 6px; }
body.still #place { opacity: 1; }

@media (max-width: 760px) {
  :root { --D: calc(100vw - 72px); }
  html, body { height: auto; } body { overflow-x: hidden; overflow-y: auto; padding: 18px 16px 24px; }
  header, nav, #sky, #scope, #verse { position: relative; left: auto; right: auto; top: auto; bottom: auto; transform: none; }
  #scope { margin: 52px auto 44px; }
  #verse { max-width: none; opacity: 1; transform: none; margin-bottom: 36px; }
  body.still #verse { transform: none; }
  #verse .body { max-height: none; -webkit-mask-image: none; mask-image: none; }
  #place { display: none; }
  #sky { text-align: left; margin-top: 10px; }
  .facet { width: 10px; height: 10px; margin: -5px 0 0 -5px; transform: rotate(var(--a)) translateY(calc(var(--D) / -2 - 20px)) rotate(45deg); }
}
@media (prefers-reduced-motion: reduce) { body.still #verse { transition: none; } }
</style>
</head>
<body>
<header><h1><a href="/">kahran singh</a></h1><p>Poet, investor, and builder.</p></header>
<div id="scope"><div id="lens"></div><div id="rim"></div></div>
<aside id="place"></aside>
<article id="verse"><h2></h2><div class="body"></div><a href="/poetry.html">poems →</a></article>
<nav><a href="/poetry.html">poems</a><a href="/photography.html">photographs</a><a href="/context/">tools</a></nav>
<div id="sky"></div>
<script src="../03/shared.js"></script>
<script>
const $ = s => document.querySelector(s)
const Q = new URLSearchParams(location.search)
const lens = $('#lens')

/* ---------- the shader: a mirror chamber over the photograph ---------- */
const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p; gl_Position = vec4(p,0.,1.); }`
const FS = `
precision highp float;
varying vec2 v;
uniform sampler2D A, B, C;          // current photo, the one we are turning from, the stray sliver
uniform vec2 aA, aB, aC;            // cover scale for each
uniform float t, rot, zoom, N, open, xf, sliver, sliverSeg, ph;
uniform vec2 drift;
uniform vec3 glow;
const float PI = 3.14159265;
vec2 cover(vec2 q, vec2 s){ return vec2(.5) + q * s * vec2(1., -1.); }
vec2 tri(vec2 x){ return 1. - abs(1. - mod(x, 2.)); }   // mirrored repeat, no seams
vec3 tex(sampler2D S, vec2 s, vec2 q){ return texture2D(S, tri(cover(q, s))).rgb; }
vec3 prism(sampler2D S, vec2 s, vec2 q, float d){   // a whisper of dispersion, like cut glass
  return vec3(texture2D(S, tri(cover(q * (1. + d), s))).r, texture2D(S, tri(cover(q, s))).g, texture2D(S, tri(cover(q * (1. - d), s))).b); }
void main(){
  vec2 p = v * .5;                                  // -.5 .. .5 inside the circle
  float r = length(p);
  if (r > .5) { gl_FragColor = vec4(0.); return; }
  // the mirrors part: each wedge widens until there is one, upright, and no fold left
  float o = smoothstep(0., 1., open);
  float a = atan(p.y, p.x) + rot * (1. - o);
  float seg = mix(2. * PI / N, 2. * PI + .0001, o * o);
  float a0 = a + PI;                                // 0 .. 2pi, seam to the left
  float k = floor(a0 / seg);
  float m = mod(a0, seg);
  m = mix(m, seg - m, mod(k, 2.) * (1. - step(.999, o)));
  float w = m - PI + ph * (1. - o);                // which slice of the photograph the mirrors hold
  vec2 dir = vec2(cos(w), sin(w));
  vec2 kq = dir * r * mix(zoom, 1., o) + drift * (1. - o);
  vec2 q = kq;
  float d = .0035 * r * (1. - o);
  vec3 col = mix(prism(B, aB, q, d), prism(A, aA, q, d), xf);
  // a sliver of another day: one wedge, rarely
  float wk = mod(k + 64., N);
  float hit = sliver * (1. - o) * (1. - step(.5, abs(wk - sliverSeg)));
  col = mix(col, tex(C, aC, kq * .85), hit);
  // glass: soft seams along the mirror edges, a faint lift at centre, a quiet vignette
  float edge = min(m, seg - m) * r + o;
  col += (1. - o) * .07 * exp(-edge * 260.) * (1. - r);
  col *= mix(1., 1.06 - .22 * r * r * 4. * .55, 1. - o * .6);
  float spec = smoothstep(.5, .0, length(p - vec2(-.16, .19))) * .06 * (1. - o * .5);
  col += spec;
  // light through glass: lift the blacks toward the photograph's own colour
  col = mix(col, glow, .14 * (1. - o)) * (1. + .05 * (1. - o));
  float aa = smoothstep(.5, .497, r);
  gl_FragColor = vec4(col * aa, aa);
}`

function makeGL(canvas) {
  const gl = canvas.getContext('webgl', { premultipliedAlpha: true, antialias: true, alpha: true })
  if (!gl) return null
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s }
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr)
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW)
  const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
  const U = new Proxy({}, { get: (o, k) => o[k] || (o[k] = gl.getUniformLocation(pr, k)) })
  ;['A', 'B', 'C'].forEach((n, i) => gl.uniform1i(U[n], i))
  return { gl, U }
}
function upload(gl, unit, img, tex) {
  gl.activeTexture(gl.TEXTURE0 + unit)
  tex = tex || gl.createTexture()
  gl.bindTexture(gl.TEXTURE_2D, tex)
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false)
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
  return tex
}
const coverScale = img => { const r = img.naturalWidth / img.naturalHeight; return r > 1 ? [1 / r, 1] : [1, r] }
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src })
// downscale big photographs to a GPU-friendly square-ish size
function shrink(img, max = 1400) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight))
  if (s === 1) return img
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s)
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.naturalWidth = c.width; c.naturalHeight = c.height; return c
}

/* ---------- palette from the photograph ---------- */
function palette(img) {
  const c = document.createElement('canvas'); c.width = c.height = 24
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24)
  const d = x.getImageData(0, 0, 24, 24).data
  let r = 0, g = 0, b = 0, n = 0, best = [0, 0, 0], bs = -1
  for (let i = 0; i < d.length; i += 4) {
    r += d[i]; g += d[i + 1]; b += d[i + 2]; n++
    const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]), s = (mx - mn) * (mx / 255)
    if (s > bs) { bs = s; best = [d[i], d[i + 1], d[i + 2]] }
  }
  const mean = [r / n, g / n, b / n]
  const mixc = (c, w, k) => c.map((v, i) => Math.round(v * k + w[i] * (1 - k)))
  const glow = mixc(best.map((v, i) => v * .5 + mean[i] * .5), [246, 244, 239], .38)
  const paper = mixc(mean, [246, 244, 239], .07)
  return { glow, paper, tint: mixc(mean, [246, 244, 239], .14) }
}
function applyPalette(p) {
  const R = document.documentElement.style
  R.setProperty('--glow', p.glow.join(','))
  window.__glow = p.glow.map(v => v / 255)
  R.setProperty('--tint', p.tint.join(','))
  document.body.style.background = `rgb(${p.paper.join(',')})`
}

// the brightest slice of the photograph: where the mirrors look, so the gem is lit
function brightest(img, seg) {
  const c = document.createElement('canvas'); c.width = c.height = 64
  const x = c.getContext('2d'), [sx, sy] = coverScale(img)
  const w = img.naturalWidth * sx, h = img.naturalHeight * sy
  x.drawImage(img, (img.naturalWidth - w) / 2, (img.naturalHeight - h) / 2, w, h, 0, 0, 64, 64)
  const d = x.getImageData(0, 0, 64, 64).data
  let best = 0, bv = -1
  for (let i = 0; i < 48; i++) {
    const th = i / 48 * Math.PI * 2; let sum = 0, sq = 0, n = 0, blown = 0
    for (let j = 0; j <= 6; j++) for (let rr = .06; rr < .46; rr += .05) {
      const a = th + seg * j / 6, u = .5 + Math.cos(a) * rr, v = .5 - Math.sin(a) * rr
      const k = (Math.floor(v * 63) * 64 + Math.floor(u * 63)) * 4
      const L = .3 * d[k] + .59 * d[k + 1] + .11 * d[k + 2]
      sum += L; sq += L * L; n++; if (L > 238) blown++
    }
    const m = sum / n, sd = Math.sqrt(Math.max(0, sq / n - m * m))
    const score = sd * (1 - Math.abs(m - 135) / 220) * (1 - blown / n)   // detail, mid-lit, not sky
    if (score > bv) { bv = score; best = th }
  }
  return best + Math.PI
}

/* ---------- the page ---------- */
S03.load().then(async ctx => {
  $('#sky').textContent = ctx.line || ''
  const wind = (ctx.reading && ctx.reading.wind_speed_10m) || 12        // km/h
  const W = Math.min(1, wind / 40)
  const days = await fetch('/v2/days.json').then(r => r.json()).then(d => d.days).catch(() => ({}))
  const poemOf = slug => ctx.data.poems.find(p => p.slug === slug)
  const photoOf = src => ctx.data.photos.find(p => p.src === src)
  // today, then the days before it, newest first; never the same photo twice
  const seen = new Set([ctx.photo.src])
  const ring = [{ iso: ctx.iso, photo: ctx.photo, poem: ctx.poem }]
  Object.keys(days).sort().reverse().forEach(iso => {
    const d = days[iso]; if (iso === ctx.iso || seen.has(d.photo)) return
    const ph = photoOf(d.photo), po = poemOf(d.poem); if (!ph || !po) return
    seen.add(d.photo); ring.push({ iso, photo: ph, poem: po })
  })
  // pad the rim with the photographs nearest today's, so there are always enough sides
  const pool = ctx.ps[ctx.photo.src] ? S03.near(ctx.ps[ctx.photo.src], ctx.ps, 40) : ctx.data.photos.map(p => p.src)
  for (const src of pool) {
    if (ring.length >= 18) break
    if (seen.has(src)) continue
    const ph = photoOf(src); if (!ph) continue
    const v = ctx.ps[src], q = v ? S03.near(v, ctx.qs, 1)[0] : null
    seen.add(src); ring.push({ iso: null, photo: ph, poem: poemOf(q) || ctx.poem })
  }

  // rim facets: a slow arc, the brightest gap left at the top for today
  const rim = $('#rim')
  ring.forEach((d, i) => {
    const b = document.createElement('button'); b.className = 'facet' + (i ? '' : ' on')
    b.style.setProperty('--a', (i / ring.length * 360) + 'deg')
    b.setAttribute('aria-label', (d.iso || '') + ' ' + S03.placeOf(d.photo))
    const im = document.createElement('i'); im.style.backgroundImage = `url("${d.photo.src}")`; b.appendChild(im)
    b.onclick = () => choose(i)
    rim.appendChild(b)
  })

  const fmt = iso => iso ? new Date(iso + 'T12:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) : ''
  function writeVerse(d) {
    $('#verse h2').textContent = d.poem.title
    const body = d.poem.stanzas.join('\n\n').replace(/^.*\n/, s => s.trim().toLowerCase() === d.poem.title.toLowerCase() ? '' : s).replace(/ \/ /g, '\n')
    const el = $('#verse .body'); el.textContent = body; el.classList.toggle('short', body.split('\n').length < 14)
    $('#place').innerHTML = ''
    $('#place').append(S03.placeOf(d.photo) || '')
    const sm = document.createElement('small'); sm.textContent = d.iso === ctx.iso ? 'today' : fmt(d.iso); $('#place').append(sm)
  }

  /* GL */
  const canvas = document.createElement('canvas'); lens.appendChild(canvas)
  let G = null
  try { G = Q.has('flat') ? null : makeGL(canvas) } catch (e) { console.warn(e); G = null }
  const first = shrink(await loadImg(ctx.photo.src))
  applyPalette(palette(first))
  writeVerse(ring[0])
  if (!G) { canvas.remove(); const im = new Image(); im.src = ctx.photo.src; im.alt = ctx.photo.alt; lens.appendChild(im); document.body.classList.add('still'); return }
  const { gl, U } = G
  const texA = upload(gl, 0, first), texB = upload(gl, 1, first)
  let sA = coverScale(first), sB = sA
  // the sliver: a different day, chosen now so it is ready when it slips in
  const strayIdx = 1 + (S03.hash(ctx.iso + 'sliver') % Math.max(1, ring.length - 1))
  let sC = sA
  loadImg(ring[strayIdx] ? ring[strayIdx].photo.src : ctx.photo.src).then(im => { if (!im) return; im = shrink(im, 900); upload(gl, 2, im); sC = coverScale(im) })
  upload(gl, 2, first)

  function size() {
    const d = Math.round(lens.clientWidth * Math.min(2, devicePixelRatio || 1))
    canvas.width = canvas.height = d; gl.viewport(0, 0, d, d)
  }
  size(); addEventListener('resize', size)

  /* motion state: everything eases toward a target */
  const S = { rot: 0, spin: 0, open: 0, openT: 0, xf: 1, dx: 0, dy: 0, tx: 0, ty: 0, sliver: 0, sliverT: 0, seg: 3 }
  let lastMove = -1e9, moved = false, cur = 0, busy = false
  const N = 6 + 2 * Math.round(W * 2)          // 6 mirrors on a calm day, up to 10 in a gale
  addEventListener('pointermove', e => {
    const r = lens.getBoundingClientRect()
    S.tx = ((e.clientX - (r.left + r.width / 2)) / innerWidth) * .55
    S.ty = ((e.clientY - (r.top + r.height / 2)) / innerHeight) * .55
    lastMove = performance.now(); moved = true
  })
  lens.addEventListener('click', () => { moved = true; lastMove = S.openT > .5 ? performance.now() : -1e9 })
  if (Q.has('still')) { moved = true; lastMove = -1e9; S.open = 1 }
  if (Q.has('open')) { S.open = +Q.get('open'); moved = false }

  async function choose(i) {
    if (i === cur || busy) return
    busy = true
    const d = ring[i], im = await loadImg(d.photo.src)
    if (!im) { busy = false; return }
    const sm = shrink(im)
    // what is showing now becomes B; the new day fades in as A while the chamber turns
    upload(gl, 1, ringImgs[cur] || first, texB); sB = sA
    upload(gl, 0, sm, texA); sA = coverScale(sm); ringImgs[i] = sm; PH = brightest(sm, 2 * Math.PI / N)
    S.xf = 0; S.spin += Math.PI * 2 / N * 3
    moved = true; lastMove = performance.now()         // fold back into the kaleidoscope to turn
    document.querySelectorAll('.facet').forEach((f, k) => f.classList.toggle('on', k === i))
    cur = i
    applyPalette(palette(sm))
    setTimeout(() => { writeVerse(d) }, 600)
    setTimeout(() => { busy = false }, 900)
  }
  const ringImgs = { 0: first }
  let PH = brightest(first, 2 * Math.PI / N)

  // mischief: now and then (and only when nobody is looking hard), one wedge shows another day
  let nextSliver = performance.now() + (Q.has('sliver') ? 1200 : 25000 + Math.random() * 50000)
  const t0 = performance.now(); let prev = t0
  function frame(now) {
    const dt = Math.min(.05, (now - prev) / 1000); prev = now
    const t = (now - t0) / 1000
    const idle = moved && now - lastMove > 2200
    S.openT = idle ? 1 : 0
    if (Q.has('open')) S.openT = S.open
    S.open += (S.openT - S.open) * (1 - Math.exp(-dt * (S.openT ? .9 : 2.6)))
    document.body.classList.toggle('still', S.open > .82)
    S.dx += (S.tx - S.dx) * (1 - Math.exp(-dt * 1.6)); S.dy += (S.ty - S.dy) * (1 - Math.exp(-dt * 1.6))
    const turn = .018 + W * .05                                   // radians per second, from the wind
    const sp = S.spin * (1 - Math.exp(-dt * 1.4)); S.spin -= sp
    S.rot += (turn * dt + sp) * (1 - S.open)
    const P2 = Math.PI * 4 / N; if (S.open < .02) S.rot = ((S.rot + P2 / 2) % P2 + P2) % P2 - P2 / 2   // invisible: the chamber repeats every two wedges
    S.xf += (1 - S.xf) * (1 - Math.exp(-dt * .9))
    if (now > nextSliver && S.open < .1) { S.sliverT = 1; S.seg = Math.floor(Math.random() * N); nextSliver = now + 2600 }
    if (S.sliverT && now > nextSliver - 400) { S.sliverT = 0; nextSliver = now + 40000 + Math.random() * 80000 }
    if (Q.has('sliver')) S.sliverT = 1
    S.sliver += (S.sliverT - S.sliver) * (1 - Math.exp(-dt * 2.2))

  }
