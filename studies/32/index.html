<style>
/* Study 32: one site. A world on the home (28's: the photograph whole, the stone's facets over it, the poem) and 27 a's years
   (the About: the block is the years, each making lifted out at its year) lead into each other. 27 a is loaded whole, as it is,
   in the frame beneath; nothing of it is rebuilt here. Every crossing has a recorded basis in crossings.json (build.mjs):
   the photograph's year is its own EXIF date; a photograph's poem is the home's own pair (v2/days.json) or a poem whose page
   carries it (og:image); a world's making is the poem's film, a place the About names, or a fact of the photograph's year. ?v=
     a  the photo stays: the year (or "about") sends the photograph itself to its year, lifted like a making; the About is around it
     b  the facets become the years: the stone's facets fly to the year rows; the photograph's own row keeps it as a strip
     c  the About rises under the photo: the photograph becomes a band; each year holds the worlds photographed in it
     d  a making opens a world: the world names its making; the making lifts with the world inside; any lifted making opens its worlds
   Numbers live in defaults.json. */
:root { --ink-seam: #0d0c0b; --ink-on: #f3efe6; --ink-on2: #c9c3b6; --sans: 'Space Grotesk', -apple-system, sans-serif; --serif: 'Fraunces', Georgia, serif; --ease: cubic-bezier(.4,0,.2,1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink-seam); color: var(--ink-on); }
a { color: inherit; }
#about { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; z-index: 1; background: #fafaf8; opacity: 0; pointer-events: none; transition: opacity .28s var(--ease); }
#about.still { transition: none; }
body[data-at="about"] #about { opacity: 1; pointer-events: auto; }
#ph { position: fixed; z-index: 3; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: cover; display: block; will-change: left, top, width, height; }
#ph.band { cursor: pointer; }
#ph[hidden] { display: none; }
#world { position: fixed; inset: 0; z-index: 4; transition: opacity .28s var(--ease); -webkit-tap-highlight-color: transparent; }
body[data-at="about"] #world, body.going #world { opacity: 0; pointer-events: none; }
#stone { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stone.morph { z-index: 6; position: fixed; }
.scrim { position: absolute; inset: 0; pointer-events: none; }
#poem { position: absolute; overflow: auto; scrollbar-width: none; font: 300 var(--poem-px, 18px)/1.5 var(--serif); color: var(--ink-on); text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 2px 18px rgba(0,0,0,.7); }
#poem::-webkit-scrollbar { display: none; }
#poem h2 { margin: 0 0 .7em; font: italic 400 1.22em/1.25 var(--serif); }
#poem h2 a { text-decoration: none; }
#poem .l { display: block; text-indent: -1em; padding-left: 1em; opacity: 0; transition: opacity .5s var(--ease); }
#poem .l.shown, #poem h2.shown { opacity: 1; }
#poem h2 { opacity: 0; transition: opacity .5s var(--ease); }
#poem .gap { display: block; height: .7em; }
header { position: absolute; z-index: 2; left: clamp(16px, 3.4vw, 56px); bottom: clamp(18px, 5vh, 56px); max-width: 34ch; color: #ede7d9; }

header p:empty { display: none; }

header nav a { color: var(--ink-on2); text-decoration: none; text-shadow: 0 1px 8px rgba(0,0,0,.6); }

.cap a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: rgba(243,239,230,.45); color: var(--ink-on); }

.vs a[aria-current] { color: #ede7d9; background: rgba(127,127,127,.4); }

body[data-at="about"]:not(:has(#ph.band)) .vs a[aria-current] { color: #1a1a1a; background: rgba(26,26,26,.12); }
@media (max-height: 560px) and (orientation: landscape) {
  header { left: 16px; bottom: 14px; max-width: 46vw; }
  header nav { margin-top: 8px; gap: 14px; }

}

}

<script type="module">
addEventListener('unhandledrejection', e => console.error('unhandled: ' + (e.reason && e.reason.stack || e.reason)))
const Q = new URLSearchParams(location.search)
const T = await window.S32T
const num = (k, f) => { const x = parseFloat(T[k]); return Number.isFinite(x) ? x : f }
const WAYS = ['a', 'b', 'c', 'd']
const V = WAYS.includes(Q.get('v')) ? Q.get('v') : WAYS.includes(T['way']) ? T['way'] : 'a'
document.documentElement.dataset.way = V
document.querySelectorAll('.vs a').forEach(a => { const q = new URLSearchParams(location.search); q.set('v', a.dataset.v); a.href = '?' + q; if (a.dataset.v === V) a.setAttribute('aria-current', 'true') })

const $ = s => document.querySelector(s)
const ph = $('#ph'), cv = $('#stone'), g = cv.getContext('2d'), poemEl = $('#poem'), frame = $('#about'), body = document.body
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const sleep = ms => new Promise(r => setTimeout(r, ms))
const nextFrame = () => new Promise(r => requestAnimationFrame(r))
let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2)
const phone = () => W < 640 && H > W * .9
const low = () => H < 560 && W > H
const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']

/* ---------- the data: the site's own, and the crossings with their basis ---------- */
const [X, data, homeSrc] = await Promise.all([fetch('crossings.json').then(r => r.json()), fetch('/v2/data.json').then(r => r.json()), fetch('/v2/home.js').then(r => r.text())])
const stanzasOf = (() => { const grab = (a, b) => { const i = homeSrc.indexOf(a), j = homeSrc.indexOf(b, i); if (i < 0 || j < 0) throw new Error('home.js moved: ' + a); return homeSrc.slice(i, j) }
  return new Function(grab('function norm', '/* ---------------------------------------------------------- the render') + '; return stanzasOf')() })()
const recOf = src => X.photos.find(p => p.src === src)
const poemBy = s => data.poems.find(p => p.slug === s), photoBy = src => data.photos.find(p => p.src === src)
const yearLabel = r => r.row === 'now' ? String(r.y) : r.row
const takenLabel = r => { const [y, m] = r.taken.split('-'); return MON[+m - 1] + ' ' + y }
const short = (t, n) => t.length > n ? t.slice(0, n - 1).replace(/[\s,.;:]+\S*$/, '') + '…' : t
// a world's making, strongest basis first: the poem's own film · a place the About names · a fact of the photograph's year · a long thing running then
function makingOf(rec, slug) {
  const film = X.poems[slug] && X.poems[slug].film
  if (film) return { id: film, basis: 'film:' + slug }
  if (rec.names.length) return { id: rec.names[0].id, basis: 'name:' + rec.names[0].why }
  if (rec.yearFacts.length) return { id: rec.yearFacts[0], basis: 'year:' + rec.row }
  if (rec.lanes.length) return { id: rec.lanes[0], basis: 'lane:' + rec.y }
  return null
}
// the worlds a lifted fact opens: its film's poem with the photograph that poem's page carries, the place it names, or its year's photographs
function worldsOf(id) {
  const out = []
  for (const [slug, p] of Object.entries(X.poems)) if (p.film === id) { const r = p.photo ? recOf(p.photo) : X.photos.find(q => q.poem === slug); if (r) out.push({ rec: r, slug, basis: 'film:' + slug }) }
  for (const r of X.photos) if (r.poem && r.names.some(n => n.id === id)) out.push({ rec: r, slug: r.poem, basis: 'name:' + r.names.find(n => n.id === id).why })
  const row = X.rowsOf[id]
  if (row) for (const r of yearWorlds(row)) if (!out.some(o => o.rec === r)) out.push({ rec: r, slug: r.poem, basis: 'year:' + row })
  return out.slice(0, num('thumbs-max', 6))
}
const yearWorlds = row => X.photos.filter(r => r.row === row && r.poem).sort((a, b) => a.taken.localeCompare(b.taken))

/* ---------- the About: 27 a in the frame, untouched but for what a crossing adds ---------- */
await new Promise(r => { if (frame.contentDocument && frame.contentDocument.readyState === 'complete' && frame.contentDocument.querySelector('.v-a')) r(); else frame.addEventListener('load', r, { once: true }) })
const fd = frame.contentDocument, fw = frame.contentWindow
const st = fd.createElement('style')
st.textContent = `
.w32 { cursor: pointer; }
.lift.w32 img { max-height: none; aspect-ratio: 3 / 2; }
.lift.w32 .w32-p { display: block; font-family: 'Fraunces', Georgia, serif; font-size: 1.05rem; line-height: 1.4; padding-top: .3rem; }
.yr.w32-lit { background: ${T['lit-ground'] || '#f2f0e8'}; }
.w32-strip { display: flow-root; overflow: hidden; height: ${num('strip-px', 64)}px; background-size: cover; background-position: center; margin: .3rem 0 .4rem; cursor: pointer; }
.w32-th { display: flex; flex-wrap: wrap; gap: 4px; margin: .35rem 0 .2rem; }
.w32-th button, .w32-ws button { border: 0; padding: 0; margin: 0; background: none; cursor: pointer; line-height: 0; }
.w32-th img, .w32-ws img { height: ${num('thumb-px', 44)}px; width: auto; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
.w32-th button[aria-current] img { outline: 1px solid #1a1a1a; outline-offset: 1px; }
.w32-world { display: block; margin-top: .8rem; padding-top: .5rem; border-top: 1px solid #f0ede8; cursor: pointer; }
.w32-world img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; max-height: none; margin: 0; }
.w32-world .w32-c, .w32-ws .jk { display: block; font: 500 .62rem 'Space Grotesk', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #6e6e6e; margin: .45rem 0 .1rem; }
.w32-world .w32-p { display: block; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-size: .9rem; color: #1a1a1a; }
.w32-ws { display: block; margin-top: .7rem; }
.w32-ws span.w32-row { display: flex; flex-wrap: wrap; gap: 4px; }
`
fd.head.append(st)
const ftex = fd.querySelector('.v-a .tex')
const rowEl = row => fd.querySelector(`.v-a .yr[data-y="${row}"]`)
const fr = el => el.getBoundingClientRect() // the frame sits at the page's own origin unless c moves it
const offsetOfFrame = () => { const r = frame.getBoundingClientRect(); return [r.left, r.top] }
const rectIn = el => { const [ox, oy] = offsetOfFrame(), r = fr(el); return { x: r.left + ox, y: r.top + oy, w: r.width, h: r.height } }
function scrollRowTo(el, at) { const r = fr(el); fw.scrollTo(0, Math.max(0, fw.scrollY + r.top - at)) }
function unquiet(row) { const el = rowEl(row); if (el && el.classList.contains('empty')) { el.classList.remove('empty'); el.dataset.w32Was = 'empty'; el.querySelector('.yl').textContent = row } return el }
function clean() {
  fd.querySelectorAll('[data-w32]').forEach(n => n.remove())
  fd.querySelectorAll('.w32-lit').forEach(n => n.classList.remove('w32-lit'))
  fd.querySelectorAll('.lane.w32-hot').forEach(n => n.classList.remove('hot', 'w32-hot'))
  fd.querySelectorAll('.yr[data-w32-was="empty"]').forEach(n => { n.classList.add('empty'); n.querySelector('.yl').textContent = ''; delete n.dataset.w32Was })
}

/* ---------- geometry (28's, from 05 B: the wind draws the facets out) ---------- */
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = Math.imul(s ^ s >>> 15, 2246822507) + 0x9e3779b9 >>> 0, ((s ^ s >>> 13) >>> 0) / 4294967296) }
function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
const io = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2
const lerp = (a, b, t) => a + (b - a) * t
function centroid(p) { let a = 0, x = 0, y = 0; for (let i = 0; i < p.length; i++) { const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length], c = x0 * y1 - x1 * y0; a += c; x += (x0 + x1) * c; y += (y0 + y1) * c } a *= .5; return a ? [x / (6 * a), y / (6 * a)] : p[0] || [0, 0] }
function clipHalf(P, f) { const o = []; for (let k = 0; k < P.length; k++) { const a = P[k], b = P[(k + 1) % P.length], fa = f(a), fb = f(b); if (fa <= 0) o.push(a); if ((fa <= 0) !== (fb <= 0)) { const t = fa / (fa - fb); o.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]) } } return o }
const inPoly = ([x, y], p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c } return c }
function voronoi(S) { const s = 1 + Math.min(num('wind', 8), 40) / 45, w = W / s, Tt = S.map(([x, y]) => [x / s, y])
  return Tt.map((p, i) => { let P = [[0, 0], [w, 0], [w, H], [0, H]]
    for (let j = 0; j < Tt.length && P.length; j++) { if (j === i) continue; const t = Tt[j], nx = t[0] - p[0], ny = t[1] - p[1]; if (!nx && !ny) continue; const mx = (p[0] + t[0]) / 2, my = (p[1] + t[1]) / 2; P = clipHalf(P, ([x, y]) => (x - mx) * nx + (y - my) * ny) }
    return P.map(([x, y]) => [x * s, y]) }) }
function plant(key) { // 20's: a hero facet, two rings, the rest scattered
  const r = rng(hash(key + '|24|' + W)), count = Math.round(phone() ? num('facets-phone', 15) : low() ? num('facets-low', 15) : num('facets-desk', 26)), min = Math.min(W, H), S = []
  let loose = 1
  const add = (x, y, gap) => { if (x < 2 || y < 2 || x > W - 2 || y > H - 2) return; if (S.some(([a, b]) => Math.hypot(a - x, b - y) < gap * loose)) return; S.push([x, y]) }
  const hero = phone() ? [W * .5, H * .2] : [W * .36, H * .44], ax = phone() ? W * .36 : W * .17, ay = phone() ? H * .12 : H * .24
  add(hero[0], hero[1], 0)
  const n1 = phone() ? 6 : 8, rot = r() * Math.PI * 2
  for (let k = 0; k < n1; k++) { const t = rot + k / n1 * Math.PI * 2 + (r() - .5) * .16; add(hero[0] + Math.cos(t) * ax, hero[1] + Math.sin(t) * ay, min * .1) }
  for (let k = 0; k < n1 * 2; k++) { const t = rot + (k + .5) / (n1 * 2) * Math.PI * 2 + (r() - .5) * .3; add(hero[0] + Math.cos(t) * ax * 1.9, hero[1] + Math.sin(t) * ay * 1.9, min * .1) }
  for (let k = 0; k < 900 && S.length < count; k++) add(r() * W, r() * H, min * .12)
  while (S.length < count) { loose *= .8; for (let k = 0; k < 300 && S.length < count; k++) add(r() * W, r() * H, min * .12) }
  return S.slice(0, count)
}
function resample(P, M) { // M points evenly round the outline, starting nearest its top-left corner
  const L = []; let tot = 0
  for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length], d = Math.hypot(b[0] - a[0], b[1] - a[1]); L.push(d); tot += d }
  const out = []; let i = 0, acc = 0
  for (let k = 0; k < M; k++) { const want = k / M * tot; while (i < P.length - 1 && acc + L[i] < want) { acc += L[i]; i++ } const a = P[i], b = P[(i + 1) % P.length], t = L[i] ? (want - acc) / L[i] : 0; out.push([lerp(a[0], b[0], t), lerp(a[1], b[1], t)]) }
  let x0 = 1e9, y0 = 1e9; for (const [x, y] of out) { x0 = Math.min(x0, x); y0 = Math.min(y0, y) }
  let best = 0, bd = 1e18; out.forEach(([x, y], k) => { const d = (x - x0) ** 2 + (y - y0) ** 2; if (d < bd) { bd = d; best = k } })
  return out.slice(best).concat(out.slice(0, best))
}
const rectPoly = r => [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]]
function cover(im, r) { const s = Math.max(r.w / im.naturalWidth, r.h / im.naturalHeight), w = im.naturalWidth * s, h = im.naturalHeight * s; return { x: r.x + (r.w - w) / 2, y: r.y + (r.h - h) / 2, w, h } }

/* ---------- the world ---------- */
let cur = null, at = 'world', busy = false, arriveRun = 0
function size() { W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR) }
function poemBox() { // where the poem sits on the photograph, clear of the name and the caption
  if (low()) return { x: W * .5, y: 16, w: W * .5 - 20, h: H - 32 }
  if (phone()) return { x: 16, y: 90, w: W - 32, h: H - 90 - 170 }
  return { x: Math.max(16, W * .06), y: H * .1, w: Math.min(W * .4, 520), h: H * .62 }
}
function drawSeams() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H)
  if (!cur) return
  g.lineJoin = 'round'
  for (const P of cur.cells) { g.beginPath(); P.forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath()
    g.strokeStyle = `rgba(13,12,11,${num('seam-alpha', .85)})`; g.lineWidth = num('seam-px', 2.2); g.stroke()
    g.strokeStyle = 'rgba(243,239,230,.12)'; g.lineWidth = .8; g.stroke() }
}
function layoutPoem() {
  const b = poemBox(), max = num('poem-max-px', 18), min = num('poem-min-px', 13)
  Object.assign(poemEl.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', maxHeight: b.h + 'px' })
  let px = max; poemEl.style.setProperty('--poem-px', px + 'px')
  while (px > min && poemEl.scrollHeight > b.h + 1) { px -= .5; poemEl.style.setProperty('--poem-px', px + 'px') }
  const sc = $('#scrim'), a = num('scrim-alpha', .6)
  sc.style.background = low() ? `linear-gradient(to left, rgba(0,0,0,${a}), rgba(0,0,0,${a * .6}) 50%, transparent 72%)` : phone() ? `linear-gradient(to bottom, rgba(0,0,0,${a * .5}), rgba(0,0,0,${a}) 22%, rgba(0,0,0,${a * .7}) 70%, rgba(0,0,0,${a}))` : `linear-gradient(to right, rgba(0,0,0,${a}), rgba(0,0,0,${a * .5}) 40%, transparent 62%), linear-gradient(to top, rgba(0,0,0,${a * .7}), transparent 30%)`
}
function setPoem(slug) {
  const p = poemBy(slug); poemEl.textContent = ''; poemEl.dataset.poem = slug
  const h = document.createElement('h2'), a = document.createElement('a'); a.href = `/poems/${slug}.html`; a.textContent = p.title; h.append(a); poemEl.append(h)
  stanzasOf(p).forEach((s, i) => { if (i) poemEl.append(Object.assign(document.createElement('span'), { className: 'gap' })); s.forEach(l => { const e = document.createElement('span'); e.className = 'l'; e.textContent = l; poemEl.append(e) }) })
  layoutPoem()
}
async function arrive() { // 17 d's arrival, doors in their place: the title, then each line in order, capped
  const run = ++arriveRun, els = [...poemEl.querySelectorAll('h2, .l')]
  if (reduce()) { els.forEach(e => e.classList.add('shown')); return }
  const step = Math.min(num('line-ms', 320), num('arrive-cap-ms', 5200) / Math.max(1, els.length))
  for (const e of els) { if (run !== arriveRun) return; e.classList.add('shown'); await sleep(step) }
}
function setCaption() {
  const r = cur.rec
  $('#place').textContent = r.place
  const y = $('#year'); y.textContent = yearLabel(r); y.dataset.basis = 'exif:' + r.taken; y.href = '/about.html'
  const m = $('#making'); m.textContent = ''; delete m.dataset.id
  if (V === 'd') { const k = makingOf(r, cur.slug); if (k) { const f = X.facts[k.id]; m.textContent = short(f.t, num('making-chars', 56)); m.dataset.id = k.id; m.dataset.basis = k.basis; m.href = '/about.html' } }
}
async function load(src) { if (ph.getAttribute('src') !== src) { ph.src = src } try { await ph.decode() } catch {} }
async function settle() { let y = -1, n = 0; for (let i = 0; i < 90 && n < 4; i++) { await nextFrame(); if (fw.scrollY === y) n++; else { n = 0; y = fw.scrollY } } } // the About's own smooth scroll comes to rest
function place(el, r) { Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }) }
const full = () => ({ x: 0, y: 0, w: W, h: H })
let moving = 0 // how many motions are under way; body[data-still] says none is, for the check
const still = () => { body.dataset.still = moving || busy ? '0' : '1' }
function tween(from, to, ms, each) { moving++; still(); return new Promise(res => { const done = () => { moving--; still(); res() }; if (reduce() || ms <= 0) { each(1); return done() } const t0 = performance.now(); const f = now => { const t = Math.min(1, (now - t0) / ms); each(io(t)); t < 1 ? requestAnimationFrame(f) : done() }; requestAnimationFrame(f) }) }
const flyRect = (a, b, ms) => tween(0, 1, ms, t => place(ph, { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t) }))
function enterWorld(rec, slug) { // the world as it rests: the photograph whole, the stone's facets over it, the poem
  cur = { rec, slug, cells: voronoi(plant(rec.src + '~' + slug)) }
  ph.hidden = false; ph.classList.remove('band'); place(ph, full()); ph.alt = photoBy(rec.src).alt
  setCaption(); setPoem(slug); drawSeams()
  at = 'world'; body.dataset.at = 'world'; body.dataset.photo = rec.src; body.dataset.poem = slug
  arrive()
}

/* ---------- a · the photo stays: it goes to its year, lifted like a making ---------- */
const A = {
  async out() {
    const r = cur.rec, row = unquiet(r.row)
    const lift = fd.createElement('span'); lift.className = 'lift w32'; lift.dataset.w32 = 'lift'; lift.dataset.basis = 'exif:' + r.taken
    lift.innerHTML = `<span class="lh">photographs</span><img alt=""><span data-t="figcaption"></span><span class="w32-p"></span>`
    lift.querySelector('img').src = r.src; lift.querySelector('[data-t="figcaption"]').textContent = r.place + ' · ' + takenLabel(r)
    lift.querySelector('.w32-p').textContent = poemBy(cur.slug).title
    row.querySelector('.run').prepend(lift)
    lift.style.visibility = 'hidden'
    try { await lift.querySelector('img').decode() } catch {}
    scrollRowTo(row, Math.round(H * num('row-at', .22)))
    await nextFrame()
    const to = rectIn(lift.querySelector('img'))
    body.dataset.at = 'about'
    await flyRect(full(), to, num('fly-ms', 1100))
    lift.style.visibility = ''; ph.hidden = true
    lift.onclick = e => { e.preventDefault(); e.stopPropagation(); A.back(lift) }
  },
  async back(lift) {
    if (busy) return; busy = true; still()
    const from = rectIn(lift.querySelector('img')); place(ph, from); ph.hidden = false; lift.style.visibility = 'hidden'
    await flyRect(from, full(), num('fly-ms', 1100))
    clean(); enterWorld(cur.rec, cur.slug); busy = false; still()
  },
}

/* ---------- b · the facets become the years ---------- */
const B = {
  async out() {
    const r = cur.rec, row = unquiet(r.row)
    const strip = fd.createElement('a'); strip.className = 'w32-strip'; strip.dataset.w32 = 'strip'; strip.dataset.basis = 'exif:' + r.taken
    strip.href = '/'; strip.setAttribute('aria-label', r.place + ' · ' + takenLabel(r)); strip.style.backgroundImage = `url("${r.src}")`; strip.style.visibility = 'hidden'
    row.querySelector('.run').prepend(strip)
    scrollRowTo(row, Math.round(H * num('row-at', .22)))
    await nextFrame()
    const plan = B.plan(row, strip)
    body.classList.add('going'); ph.hidden = true; cv.classList.add('morph'); document.body.append(cv)
    frame.classList.add('still'); await B.run(plan, 0, 1)
    strip.style.visibility = ''; body.dataset.at = 'about'; body.classList.remove('going'); frame.style.opacity = ''; frame.style.pointerEvents = ''; frame.classList.remove('still')
    cv.classList.remove('morph'); $('#world').prepend(cv); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H)
    strip.onclick = async e => { e.preventDefault(); if (busy) return; busy = true; still()
      const p2 = B.plan(row, strip); strip.style.visibility = 'hidden'; body.dataset.at = 'world'; body.classList.add('going'); cv.classList.add('morph'); document.body.append(cv)
      frame.classList.add('still'); await B.run(p2, 1, 0); frame.style.opacity = ''; frame.style.pointerEvents = ''; frame.classList.remove('still'); cv.classList.remove('morph'); $('#world').prepend(cv); body.classList.remove('going'); clean(); enterWorld(cur.rec, cur.slug); busy = false; still() }
  },
  plan(row, strip) { // the facets in reading order go to the year rows on screen in order; the photograph's own row takes its facets as the strip
    const rows = [...fd.querySelectorAll('.v-a .yr')].map(el => ({ el, r: rectIn(el) })).filter(o => o.r.y + o.r.h > 0 && o.r.y < H && o.r.h > 2)
    const cells = cur.cells.map(P => ({ P, c: centroid(P) })).sort((a, b) => a.c[1] - b.c[1] || a.c[0] - b.c[0])
    const pr = Math.max(0, rows.findIndex(o => o.el === row)), R = rows.length, N = cells.length
    cells.forEach((c, k) => c.row = Math.min(R - 1, Math.floor(k * R / N)))
    let mine = cells.filter(c => c.row === pr); if (mine.length < 3) { const near = cells.slice().sort((a, b) => Math.abs(a.row - pr) - Math.abs(b.row - pr)); mine = near.slice(0, 3); mine.forEach(c => c.row = pr) }
    const sr = rectIn(strip), M = 32, im = ph
    const by = new Map(); cells.forEach(c => { if (!by.has(c.row)) by.set(c.row, []); by.get(c.row).push(c) })
    for (const [k, cs] of by) { cs.sort((a, b) => a.c[0] - b.c[0]); const R0 = k === pr ? sr : { x: rows[k].r.x + rows[k].r.w * .08, y: rows[k].r.y, w: rows[k].r.w * .84, h: rows[k].r.h }
      cs.forEach((c, i) => { c.to = { x: R0.x + R0.w * i / cs.length, y: R0.y, w: R0.w / cs.length, h: R0.h }; c.mine = k === pr }) }
    return { cells: cells.map(c => ({ A: resample(c.P, M), B: resample(rectPoly(c.to), M), mine: c.mine })), im, from: cover(im, full()), to: cover(im, sr) }
  },
  run(plan, a, b) { return tween(0, 1, num('morph-ms', 1600), t => { const u = lerp(a, b, t)
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H)
    g.fillStyle = `rgba(13,12,11,${1 - Math.min(1, u * 1.4)})`; g.fillRect(0, 0, W, H)
    frame.style.opacity = Math.max(0, (u - .45) / .55); frame.style.pointerEvents = 'none'
    const imr = { x: lerp(plan.from.x, plan.to.x, u), y: lerp(plan.from.y, plan.to.y, u), w: lerp(plan.from.w, plan.to.w, u), h: lerp(plan.from.h, plan.to.h, u) }
    for (const c of plan.cells) { g.save(); g.beginPath(); c.A.forEach(([x, y], k) => { const X0 = lerp(x, c.B[k][0], u), Y0 = lerp(y, c.B[k][1], u); k ? g.lineTo(X0, Y0) : g.moveTo(X0, Y0) }); g.closePath()
      g.globalAlpha = c.mine ? 1 : Math.max(0, 1 - u * 1.25); g.save(); g.clip()
      if (c.mine) g.drawImage(plan.im, imr.x, imr.y, imr.w, imr.h); else g.drawImage(plan.im, plan.from.x, plan.from.y, plan.from.w, plan.from.h)
      g.restore(); g.globalAlpha = (1 - u) * num('seam-alpha', .85); g.strokeStyle = '#0d0c0b'; g.lineWidth = num('seam-px', 2.2); g.stroke(); g.restore() }
  }) },
}

/* ---------- c · the About rises under the photo; each year holds the worlds photographed in it ---------- */
const C = {
  band() { return low() ? { x: 0, y: 0, w: Math.round(W * num('band-vw-low', 38) / 100), h: H } : { x: 0, y: 0, w: W, h: Math.round(H * num('band-vh', 30) / 100) } },
  sheet(open) { const b = C.band(); Object.assign(frame.style, open ? (low() ? { left: b.w + 'px', top: '0px', width: (W - b.w) + 'px', height: H + 'px' } : { left: '0px', top: b.h + 'px', width: W + 'px', height: (H - b.h) + 'px' }) : { left: '', top: '', width: '', height: '' }) },
  marks() { // every year's photographs that have a recorded poem, as small doors back into a world
    for (const el of fd.querySelectorAll('.v-a .yr')) { const ws = yearWorlds(el.dataset.y); if (!ws.length) continue
      const box = fd.createElement('span'); box.className = 'w32-th'; box.dataset.w32 = 'thumbs'; box.dataset.row = el.dataset.y
      for (const r of ws) { const b = fd.createElement('button'); b.type = 'button'; b.dataset.src = r.src; b.dataset.basis = 'exif:' + r.taken; b.dataset.poem = r.poem; b.setAttribute('aria-label', r.place + ' · ' + takenLabel(r))
        if (r.src === cur.rec.src) b.setAttribute('aria-current', 'true')
        const im = fd.createElement('img'); im.src = r.src; im.alt = ''; im.loading = 'lazy'; b.append(im); b.onclick = e => { e.preventDefault(); C.into(r, im) }; box.append(b) }
      if (el.classList.contains('empty')) unquiet(el.dataset.y)
      el.querySelector('.run').append(box) }
  },
  async out() {
    const r = cur.rec; C.marks()
    const row = rowEl(r.row); row.classList.add('w32-lit'); row.dataset.basis = 'exif:' + r.taken
    row.querySelectorAll('.lane').forEach(l => { if (l.dataset.g && r.lanes.includes(l.dataset.g) && !l.classList.contains('hot')) l.classList.add('hot', 'w32-hot') })
    C.sheet(true); await nextFrame(); scrollRowTo(row, 12)
    const b = C.band(); body.dataset.at = 'about'
    frame.style.transform = low() ? `translateX(${W}px)` : `translateY(${H}px)`; await nextFrame()
    const ms = num('sheet-ms', 900)
    await Promise.all([flyRect(full(), b, ms), tween(0, 1, ms, t => frame.style.transform = low() ? `translateX(${(1 - t) * W}px)` : `translateY(${(1 - t) * H}px)`)])
    frame.style.transform = ''; ph.classList.add('band'); ph.onclick = () => C.back()
  },
  async back() { if (busy) return; busy = true; still(); ph.onclick = null
    const ms = num('sheet-ms', 900)
    await Promise.all([flyRect(C.band(), full(), ms), tween(0, 1, ms, t => frame.style.transform = low() ? `translateX(${t * W}px)` : `translateY(${t * H}px)`)])
    frame.style.transform = ''; C.sheet(false); clean(); enterWorld(cur.rec, cur.slug); busy = false; still() },
  async into(r, im) { if (busy) return; busy = true; still(); ph.onclick = null
    const from = rectIn(im); await load(r.src); place(ph, from); ph.classList.remove('band')
    const ms = num('sheet-ms', 900)
    await Promise.all([flyRect(from, full(), ms), tween(0, 1, ms, t => frame.style.opacity = 1 - t)])
    frame.style.opacity = ''; C.sheet(false); clean(); enterWorld(r, r.poem); busy = false; still() },
}

/* ---------- d · a making opens a world ---------- */
const D = {
  async out() {
    const m = $('#making').dataset.id || makingOf(cur.rec, cur.slug).id
    const node = fd.querySelector(`.v-a .tex [data-id="${CSS.escape(m)}"]`), a = node && node.querySelector('a.u')
    scrollRowTo(node, Math.round(H * num('row-at', .22)))
    a.dispatchEvent(new fw.MouseEvent('click', { bubbles: true, cancelable: true, button: 0 }))
    const box = await D.box(); D.mine(box)
    await nextFrame(); const img = box.querySelector('.w32-world img'); try { await img.decode() } catch {}
    await settle(); const q = img.getBoundingClientRect(); if (q.top < 0 || q.bottom > fw.innerHeight) { fw.scrollBy(0, q.top - Math.round(fw.innerHeight * num('row-at', .22))); await settle() }
    const to = rectIn(img); img.style.visibility = 'hidden'; body.dataset.at = 'about'
    await flyRect(full(), to, num('fly-ms', 1100)); img.style.visibility = ''; ph.hidden = true
  },
  box: async () => { for (let i = 0; i < 60; i++) { const b = ftex.querySelector('.fl'); if (b) return b; await sleep(30) } throw new Error('no lift') },
  mine(box) { // the world you came from, inside the making it opened
    if (box.querySelector('.w32-world')) return
    const r = cur.rec, w = fd.createElement('span'); w.className = 'w32-world'; w.dataset.w32 = 'world'; w.dataset.basis = $('#making').dataset.basis || ''
    w.innerHTML = '<img alt=""><span class="w32-c"></span><span class="w32-p"></span>'
    w.querySelector('img').src = r.src; w.querySelector('.w32-c').textContent = r.place + ' · ' + takenLabel(r); w.querySelector('.w32-p').textContent = poemBy(cur.slug).title
    w.onclick = e => { e.preventDefault(); e.stopPropagation(); D.into(r, cur.slug, w.querySelector('img')) }
    const ct = box.querySelector('.ct'); ct ? ct.after(w) : box.append(w)
  },
  worlds(box) { // any lifted making opens the worlds its basis reaches
    if (box.querySelector('.w32-ws')) return
    const id = ftex.querySelector('.on')?.dataset.id; if (!id) return
    const ws = worldsOf(id); if (!ws.length) return
    const s = fd.createElement('span'); s.className = 'w32-ws'; s.dataset.w32 = 'worlds'; s.dataset.of = id
    const k = fd.createElement('span'); k.className = 'jk'; k.textContent = 'worlds'; const rowS = fd.createElement('span'); rowS.className = 'w32-row'; s.append(k, rowS)
    for (const o of ws) { const b = fd.createElement('button'); b.type = 'button'; b.dataset.src = o.rec.src; b.dataset.poem = o.slug; b.dataset.basis = o.basis; b.setAttribute('aria-label', o.rec.place + ' · ' + takenLabel(o.rec))
      const im = fd.createElement('img'); im.src = o.rec.src; im.alt = ''; b.append(im); b.onclick = e => { e.preventDefault(); e.stopPropagation(); D.into(o.rec, o.slug, im) }; rowS.append(b) }
    box.append(s)
  },
  async into(r, slug, im) { if (busy) return; busy = true; still()
    const from = rectIn(im); await load(r.src); place(ph, from); ph.hidden = false; im.style.visibility = 'hidden'
    await flyRect(from, full(), num('fly-ms', 1100))
    fd.querySelector('.fl') && fw.dispatchEvent(new fw.KeyboardEvent('keydown', { key: 'Escape' }))
    clean(); enterWorld(r, slug); busy = false; still() },
}
new MutationObserver(() => { if (V !== 'd' || at === 'loading') return; const box = ftex.querySelector('.fl'); if (box) D.worlds(box) }).observe(ftex, { childList: true, subtree: true })

/* ---------- the escape, and the frame's own way in ---------- */
const WAY = { a: A, b: B, c: C, d: D }[V]
async function escape(e) { e && e.preventDefault(); if (busy || body.dataset.at !== 'world') return; busy = true; still(); arriveRun++
  try { clean(); await WAY.out(); at = 'about' } finally { busy = false; still() } }
$('#year').addEventListener('click', escape)
$('#to-about').addEventListener('click', escape)
$('#making').addEventListener('click', escape)
cv.addEventListener('click', e => { if (V !== 'b' || body.dataset.at !== 'world') return; const p = [e.clientX, e.clientY]; if (cur.cells.some(P => inPoly(p, P))) escape(e) })
addEventListener('resize', () => { size(); if (cur && body.dataset.at === 'world') { cur.cells = voronoi(plant(cur.rec.src + '~' + cur.slug)); place(ph, full()); drawSeams(); layoutPoem() } })

/* ---------- which world: ?at=<photograph> (&p=<poem>), else today's pair as the home chooses it ---------- */
size()
await Promise.race([Promise.all(['300 18px Fraunces', 'italic 400 18px Fraunces', '500 12px "Space Grotesk"'].map(f => document.fonts.load(f))), sleep(3000)]) // the poem is fitted in its own face
let rec = null, slug = null
const atQ = Q.get('at')
if (atQ) { rec = X.photos.find(p => p.src === '/photos/' + atQ.replace(/\.jpg$/, '') + '.jpg'); slug = Q.get('p') && X.poems[Q.get('p')] ? Q.get('p') : rec && rec.poem }
if (!rec || !slug) { const ctx = await S14.load($('#where')); rec = recOf(ctx.photo.src); slug = X.poems[ctx.poem.slug] ? ctx.poem.slug : rec.poem }
await load(rec.src)
enterWorld(rec, slug)
if (Q.get('in') === 'about') { body.dataset.at = 'about'; ph.hidden = true; at = 'about' }
still()
</script>
</body>
