    <style>
        main {
            max-width: 100%;
            margin-left: 240px;
            margin-right: 0;
            padding: 2rem 1.5rem 0;
        }

        .photo-page-header {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 1rem;
            text-align: center;
        }

        .photo-page-header h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 2rem;
            font-weight: 400;
            font-style: italic;
            line-height: 1.3;
            margin: 0;
        }

        .photo-page-header p {
            color: #bbb;
            font-size: 0.85rem;
            margin-top: 0.4rem;
            letter-spacing: 0.03em;
        }

        .camera-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.25rem; margin-top: 1rem; font-size: .8rem; }
        .camera-filters[hidden] { display: none; }
        .camera-filters a { color: #777; padding: .5rem 0; text-decoration: none; }
        .camera-filters a:hover, .camera-filters a[aria-current] { color: #333; text-decoration: underline; text-underline-offset: .25em; }

        /* Single-column gallery */
        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25vh;
        }

        .photo-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 50vh 0;
        }

        .photo-wrap img {
            max-width: min(900px, 100%);
            max-height: 75vh;
            width: auto;
            display: block;
            cursor: pointer;
            filter: contrast(1.05);
        }

        /* Alternate narrower widths for breathing rhythm */
        .photo-wrap.narrow img {
            max-width: min(650px, 100%);
            max-height: 65vh;
        }

        /* Diptych pairs */
        .photo-pair {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 50vh 0;
        }

        .photo-pair .pair-inner {
            display: flex;
            gap: 0.5rem;
            max-width: min(1100px, 100%);
            width: 100%;
        }

        /* Each picture's flex-grow is its own width-to-height ratio (set by the
           script), so the two share one height and neither is cropped. */
        .photo-pair .pair-inner { align-items: flex-start; }
        .photo-pair .pair-inner img {
            flex: 1 1 0;
            min-width: 0;
            display: block;
            cursor: pointer;
            filter: contrast(1.05);
        }

        /* Fade-in animation */
        .photo-wrap, .photo-pair {
            opacity: 1;
        }

        .photo-wrap.visible, .photo-pair.visible {
            opacity: 1;
        }

        .photo-wrap.no-fade, .photo-pair.no-fade {
            opacity: 1;
            transition: none;
        }


        /* Study 13's numbers (the chain's weights, the colour order's mid-tone terms, the graph's
           edge threshold) are dials in defaults.json. The script reads that file itself; these
           mirror it so the ?tune panel and verify's fallback rule see every dial. */
        :root {
            --chain-w-colour: var(--w-colour, 1);
            --chain-w-tone: var(--w-tone, 1);
            --chain-w-lines: var(--w-lines, 1);
            --chain-w-horizon: var(--w-horizon, 1);
            --chain-w-layout: var(--w-layout, 1);
            --chain-w-subject: var(--w-subject, 1.5);
            --chain-w-place: var(--w-place, 0.5);
            --chain-w-hour: var(--w-hour, 0.5);
            --chain-lead: var(--lead, 3);
            --chain-link-min: var(--link-min, 0.4);
            --chain-pair-every: var(--pair-every, 5);
            --chain-mid-weight: var(--mid-weight, 0.5);
            --chain-l-step: var(--l-step, 0.5);
            --chain-c-step: var(--c-step, 0.3);
            --chain-mid-lo: var(--mid-lo, 28);
            --chain-mid-hi: var(--mid-hi, 56);
            --chain-edge-max: var(--edge-max, 0.45);
        }

        /* The step between two pictures: both, small, and the word that ties them. */
        .link { display: flex; align-items: center; justify-content: center; gap: .75rem; font-family: 'Space Grotesk', sans-serif; font-size: var(--link-size, .7rem); letter-spacing: .04em; color: #999; }
        .link img { height: var(--strip-h, 44px); width: auto; display: block; filter: contrast(1.05); }
        .link span { width: 8em; flex: none; text-align: center; }
        .link.quiet span { color: #ccc; }
        .pair-link { text-align: center; margin-top: .6rem; font-family: 'Space Grotesk', sans-serif; font-size: var(--link-size, .7rem); letter-spacing: .04em; color: #999; }
        .camera-filters + .camera-filters { margin-top: .25rem; }
        .thread-sum { font-family: 'Space Grotesk', sans-serif; font-size: .75rem; color: #999; margin-top: .75rem; font-variant-numeric: tabular-nums; }
        .thread { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem 2rem; max-width: 1200px; margin: 3rem auto 6rem; }
        .thread .link { justify-content: flex-start; margin: 0; }
        .graph { max-width: 1200px; margin: 2rem auto 4rem; font-family: 'Space Grotesk', sans-serif; }
        .graph svg { display: block; width: 100%; height: auto; overflow: visible; -webkit-tap-highlight-color: transparent; }
        .graph .band { fill: #e8e6e1; opacity: .4; }
        .graph .axis { font-size: 10px; letter-spacing: .08em; fill: #bbb; }
        .graph .edge { stroke: #ddd; stroke-width: .75; }
        .graph .walk { stroke: #999; stroke-width: 1.25; fill: none; stroke-linejoin: round; }
        .graph .node { cursor: pointer; }
        .graph .node rect { fill: none; stroke: transparent; stroke-width: 1.5; }
        .graph .word { font-size: 10px; letter-spacing: .04em; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 3px; text-anchor: middle; }
        .graph .edge, .graph .walk, .graph .node { transition: opacity .2s cubic-bezier(.4,0,.2,1); }
        .graph.focus .edge, .graph.focus .node { opacity: .18; }
        .graph.focus .walk { opacity: .35; }
        .graph.focus .edge.on { opacity: 1; stroke: #999; }
        .graph.focus .node.on { opacity: 1; }
        .graph .node.here rect { stroke: #333; }
        .graph .step { stroke: #333; stroke-width: 1.5; }
        .graph-read { min-height: 2.6em; margin: 0 16px .75rem; text-align: center; font-size: .75rem; line-height: 1.3; color: #999; font-variant-numeric: tabular-nums; }
        .graph-read b { font-weight: 400; color: #333; }
        .thread .link b { font-weight: 400; color: #ccc; width: 1.6em; text-align: right; font-variant-numeric: tabular-nums; }

        /* Photo counter */
        .photo-counter {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.7rem;
            color: #e8e6e1;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* Footer */
        .photo-footer {
            text-align: center;
            padding: 10vh 0 6rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .photo-footer p {
            font-family: 'Fraunces', Georgia, serif;
            font-style: italic;
            font-size: 0.85rem;
            color: #bbb;
            margin: 0 0 1.5rem;
        }

        .photo-footer a {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            color: #999;
            text-decoration: none;
            border-bottom: 1px solid #ddd;
            padding-bottom: 2px;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .photo-footer a:hover {
            color: #333;
            border-color: #999;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: fixed;
            top: 1rem;
            right: 1.5rem;
            z-index: 1001;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 2.5rem;
            line-height: 1;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
        }

        .lightbox-close:hover,
        .lightbox-close:focus {
            color: #fff;
        }

        /* Auto-scroll indicator */
        .auto-scroll-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 99;
            opacity: 0;
            animation: scrollIndicatorFade 4s ease forwards;
        }

        .auto-scroll-indicator::after {
            content: ' \u25BE';
            font-size: 0.8em;
        }

        @keyframes scrollIndicatorFade {
            0% { opacity: 0; }
            15% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media (max-width: 768px) {
            main {
                margin-left: 0;
                padding: 1.5rem 1rem 0;
            }

            .photo-page-header h1 {
                font-size: 1.6rem;
            }

            .gallery {
                padding-top: 10vh;
            }

            /* The gutter sits on the wrap, not the picture: padding on an img with
               an aspect-ratio squeezes the picture inside it. */
            .photo-wrap {
                padding: 10vh 0.5rem;
                box-sizing: border-box;
            }

            .photo-wrap img {
                max-width: 100%;
            }

            .photo-wrap.narrow img {
                max-width: 100%;
            }

            .photo-pair {
                padding: 10vh 0;
            }

            .photo-pair .pair-inner {
                max-width: 100%;
                padding: 0 0.5rem;
                box-sizing: border-box;
            }

            .photo-counter {
                bottom: 1.2rem;
                right: 1.2rem;
                font-size: 0.65rem;
                color: #e8e6e1;
            }

            .photo-footer {
                padding: 6vh 1rem 5rem;
            }
        }
    </style>

    <div class="photo-counter" id="photo-counter"></div>

    <div class="lightbox" id="lightbox">
        <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script src="chain.js"></script>
    <script src="tune.js"></script>
    <script>
    async function main() {
    const feats = (await (await fetch('features.json')).json()).photos;
    const dflt = await (await fetch('defaults.json', { cache: 'no-store' })).json();
    const dial = (k) => parseFloat(dflt[k]);
    const linkMin = dial('link-min'), pairEvery = Math.round(dial('pair-every'));
    const WEIGHTS = Chain.sets(dial);

    const params = new URLSearchParams(window.location.search);
    // Colour is the study's default order (Kahran, 2026-10-28: "I want it by color").
    const order = WEIGHTS[params.get('order')] || params.get('order') === 'today' ? params.get('order') : 'colour';
    const view = ['thread', 'graph'].includes(params.get('view')) ? params.get('view') : 'walk';
    const M = Chain.model(feats);
    let seq;
    if (order === 'today') {
        // Today's walk: a fresh shuffle on every visit, as on /photography.html.
        seq = feats.map((_, i) => i);
        for (let i = seq.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [seq[i], seq[j]] = [seq[j], seq[i]]; }
    } else seq = Chain.path(M, WEIGHTS[order]);
    const wLinks = WEIGHTS[order] || WEIGHTS.blend;
    const links = seq.slice(1).map((j, k) => Chain.link(M, wLinks, seq[k], j, linkMin));
    const photos = seq.map((i) => feats[i]);

    // In ?tune, a moved dial is saved to defaults.json; read it back by reloading.
    if (/[?&]tune\b/.test(location.search)) {
        const sig = Object.keys(dflt).map((k) => String(dflt[k])).join('|');
        const st = document.documentElement.style;
        new MutationObserver(() => {
            const now = Object.keys(dflt).map((k) => st.getPropertyValue('--' + k).trim()).join('|');
            if (now !== sig) setTimeout(() => location.reload(), 700);
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
    }

    const qs = (o, v) => { const p = new URLSearchParams(location.search); o === 'colour' ? p.delete('order') : p.set('order', o); v === 'walk' ? p.delete('view') : p.set('view', v); const s = p.toString(); return s ? '?' + s : './'; };
    const orders = document.getElementById('orders'), views = document.getElementById('views');
    orders.querySelectorAll('a').forEach(a => { a.href = qs(a.dataset.order, view); if (a.dataset.order === order) a.setAttribute('aria-current', 'page'); });
    views.querySelectorAll('a').forEach(a => { a.href = qs(order, a.dataset.view); if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); });
    orders.hidden = views.hidden = false;

    const gallery = document.getElementById('gallery');
    const counter = document.getElementById('photo-counter');
    const strip = (a, b, l, n) => {
        const el = document.createElement('div');
        el.className = 'link' + (l.word ? '' : ' quiet');
        if (n) { const i = document.createElement('b'); i.textContent = n; el.appendChild(i); }
        for (const [p, w] of [[a, null], [null, l.word || '·'], [b, null]]) {
            if (p) { const im = document.createElement('img'); im.src = '/photos/' + p.f; im.alt = ''; im.loading = 'lazy'; if (p.w && p.h) im.style.aspectRatio = p.w + '/' + p.h; el.appendChild(im); }
            else { const s = document.createElement('span'); s.textContent = w; el.appendChild(s); }
        }
        return el;
    };

    if (view === 'graph') {
        await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
        // Every picture placed by its colour: lightness across (dark to pale), warm above and
        // cool below (Lab b, with a), monochromes on the middle line. Edges join pairs under
        // `edge-max` on the colour order's distance; the chosen walk runs through them.
        const n = feats.length, wc = WEIGHTS.colour, edgeMax = dial('edge-max'), lo = dial('mid-lo'), hi = dial('mid-hi');
        const pos = seq.map(() => 0); seq.forEach((i, k) => { pos[i] = k; });
        const word = new Map(); links.forEach((l, k) => { word.set(seq[k] + '>' + seq[k + 1], l.word); word.set(seq[k + 1] + '>' + seq[k], l.word); });
        const edges = [];
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (Chain.dist(M, wc, i, j) < edgeMax) edges.push([i, j]);
        const nb = feats.map(() => new Set());
        for (const [i, j] of edges) { nb[i].add(j); nb[j].add(i); }
        for (let k = 1; k < seq.length; k++) { nb[seq[k - 1]].add(seq[k]); nb[seq[k]].add(seq[k - 1]); }
        const warm = feats.map((p) => p.mono ? 0 : 0.35 * p.a + 0.9 * p.b);
        const wMax = Math.max(...warm.map(Math.abs)) || 1;
        const Ls = feats.map((p) => p.L), Lmin = Math.min(...Ls) - 2, Lmax = Math.max(...Ls) + 2;

        const box = document.createElement('div'); box.className = 'graph';
        const read = document.createElement('p'); read.className = 'graph-read'; read.setAttribute('aria-live', 'polite');
        gallery.replaceWith(box);
        counter.remove();
        const sum = document.getElementById('thread-sum');
        const cs = Chain.colourStats(M, seq, lo, hi);
        sum.textContent = `${n} pictures · ${edges.length} edges · ${cs.midSteps} mid-tone steps`;
        sum.hidden = false;
        const NS = 'http://www.w3.org/2000/svg';
        const el = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; };

        let focus = null;
        function draw() {
            const W = Math.max(300, box.clientWidth), phone = W < 600;
            // On a phone the long side carries lightness (the crowded axis): dark at the top.
            const H = Math.round(phone ? W * 1.6 : W * 0.56);
            const s = phone ? 26 : Math.min(48, Math.round(W / 26)), pad = s * 0.7 + 4, padL = s * 0.7 + 16;
            const along = (L, len, p) => p + (L - Lmin) / (Lmax - Lmin) * (len - 2 * p);
            const across = (v, len, p) => len / 2 - Math.sign(v) * Math.sqrt(Math.abs(v) / wMax) * (len / 2 - p);
            const place = (L, v) => phone ? [W - across(v, W, pad), along(L, H, padL)] : [along(L, W, pad), across(v, H, padL)];
            const target = feats.map((p, i) => place(p.L, warm[i]));
            // Settle with d3-force: each node held to its colour place, none covering another.
            const r = s * 0.6;
            const nodes = target.map(([x, y]) => ({ x, y, tx: x, ty: y }));
            const sim = d3.forceSimulation(nodes)
                .force('x', d3.forceX((d) => d.tx).strength(0.12))
                .force('y', d3.forceY((d) => d.ty).strength(0.12))
                .force('collide', d3.forceCollide(r).iterations(2))
                .stop();
            for (let it = 0; it < 300; it++) {
                sim.tick();
                for (const d of nodes) { d.x = Math.max(pad, Math.min(W - pad, d.x)); d.y = Math.max(padL, Math.min(H - padL, d.y)); }
            }
            const xy = nodes.map((d) => [d.x, d.y]);
            const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': `${n} photographs placed by colour, the walk drawn through them` });
            const ax = el('g', { class: 'axis' }, svg);
            const lab = (x, y, t, anchor) => { const e = el('text', { x, y, 'text-anchor': anchor }, ax); e.textContent = t; };
            if (phone) {
                const y0 = along(lo, H, padL), y1 = along(hi, H, padL);
                el('rect', { class: 'band', x: 0, y: y0, width: W, height: y1 - y0 }, svg);
                lab(0, 24, 'dark', 'start'); lab(0, H - 2, 'pale', 'start'); lab(0, y0 + 12, 'mid-tone', 'start');
                lab(W, 10, 'warm', 'end'); lab(W / 2, 10, 'grey', 'middle'); lab(0, 10, 'cool', 'start');
            } else {
                const x0 = along(lo, W, pad), x1 = along(hi, W, pad);
                el('rect', { class: 'band', x: x0, y: 0, width: x1 - x0, height: H }, svg);
                lab(0, H - 2, 'dark', 'start'); lab(W, H - 2, 'pale', 'end'); lab((x0 + x1) / 2, H - 2, 'mid-tone', 'middle');
                lab(0, 10, 'warm', 'start'); lab(0, H / 2 + 3, 'grey', 'start'); lab(0, H - 16, 'cool', 'start');
            }
            const eg = el('g', {}, svg), lines = [];
            for (const [i, j] of edges) lines.push([i, j, el('line', { class: 'edge', x1: xy[i][0], y1: xy[i][1], x2: xy[j][0], y2: xy[j][1] }, eg)]);
            el('path', { class: 'walk', d: 'M' + seq.map((i) => xy[i][0].toFixed(1) + ' ' + xy[i][1].toFixed(1)).join('L') }, svg);
            const hl = el('g', {}, svg), ng = el('g', {}, svg), groups = [];
            feats.forEach((p, i) => {
                const k = s / Math.max(p.w, p.h), w = p.w * k, h = p.h * k;
                const g = el('g', { class: 'node', transform: `translate(${xy[i][0].toFixed(1)} ${xy[i][1].toFixed(1)})`, tabindex: 0, role: 'button', 'aria-label': p.alt }, ng);
                el('image', { href: 'thumbs/' + p.f, x: -w / 2, y: -h / 2, width: w, height: h }, g);
                el('rect', { x: -w / 2 - 1.5, y: -h / 2 - 1.5, width: w + 3, height: h + 3 }, g);
                g.addEventListener('mouseenter', () => { if (!phone) set(i); });
                g.addEventListener('focus', () => set(i));
                g.addEventListener('click', (e) => { e.stopPropagation(); set(focus === i && phone ? null : i); });
                groups.push(g);
            });
            svg.addEventListener('mouseleave', () => { if (!phone) set(null); });
            svg.addEventListener('click', () => set(null));
            function set(i) {
                focus = i;
                box.classList.toggle('focus', i !== null);
                hl.replaceChildren();
                groups.forEach((g, j) => { g.classList.toggle('on', i !== null && (j === i || nb[i].has(j))); g.classList.toggle('here', j === i); });
                lines.forEach(([a, b, e]) => e.classList.toggle('on', a === i || b === i));
                if (i === null) { read.textContent = ''; return; }
                ng.appendChild(groups[i]);
                const k = pos[i], prev = seq[k - 1], next = seq[k + 1];
                for (const j of [prev, next]) {
                    if (j === undefined) continue;
                    el('line', { class: 'step', x1: xy[i][0], y1: xy[i][1], x2: xy[j][0], y2: xy[j][1] }, hl);
                    const t = el('text', { class: 'word', x: (xy[i][0] + xy[j][0]) / 2, y: (xy[i][1] + xy[j][1]) / 2 + 3 }, hl);
                    t.textContent = word.get(i + '>' + j) || '·';
                }
                read.replaceChildren();
                const add = (t, b) => { const e = document.createElement(b ? 'b' : 'span'); e.textContent = t; read.appendChild(e); };
                add(`${k + 1} · `); add(prev === undefined ? '' : (word.get(prev + '>' + i) || '·') + ' → ');
                add(feats[i].notes || feats[i].alt, true); add(next === undefined ? '' : ' → ' + (word.get(i + '>' + next) || '·'));
                add(` · L ${Math.round(feats[i].L)}${feats[i].mono ? '' : ' · C ' + Math.round(feats[i].chroma)}`);
            }
            box.replaceChildren(read, svg);
            if (focus !== null) set(focus);
        }
        draw();
        let rt, lastW = box.clientWidth;
        window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (box.clientWidth !== lastW) { lastW = box.clientWidth; draw(); } }, 150); });
        return;
    }

    if (view === 'thread') {
        const named = links.filter(l => l.word).length;
        const mean = Chain.cost(M, WEIGHTS.blend, seq) / links.length;
        const sum = document.getElementById('thread-sum');
        const cs = Chain.colourStats(M, seq, dial('mid-lo'), dial('mid-hi'));
        sum.textContent = `${photos.length} pictures · ${named} of ${links.length} steps named · ${mean.toFixed(2)} apart · ${cs.midSteps} mid-tone steps`;
        sum.hidden = false;
        const t = document.createElement('div'); t.className = 'thread';
        links.forEach((l, k) => t.appendChild(strip(photos[k], photos[k + 1], l, k + 1)));
        gallery.replaceWith(t);
        counter.remove();
        return;
    }

    const enhancedGallery = document.createDocumentFragment();
    let photoIndex = 0; // tracks position in the photos array
    let displayIndex = 0; // tracks the visual position for layout logic

    while (photoIndex < photos.length) {
        displayIndex++;
        if (photoIndex > 0) enhancedGallery.appendChild(strip(photos[photoIndex - 1], photos[photoIndex], links[photoIndex - 1]));

        // Every Nth position, a diptych of the next two in the chain
        if (pairEvery > 0 && displayIndex % pairEvery === 0 && photoIndex + 1 < photos.length) {
            const pair = document.createElement('div');
            pair.classList.add('photo-pair');
            pair.dataset.index = displayIndex;

            const inner = document.createElement('div');
            inner.classList.add('pair-inner');

            for (let p = 0; p < 2; p++) {
                const photo = photos[photoIndex];
                const filename = photo.f;
                const img = document.createElement('img');
                img.src = '/photos/' + filename;
                img.alt = photo.alt;
                if (photo.w && photo.h) { img.style.aspectRatio = photo.w + '/' + photo.h; img.style.flexGrow = photo.w / photo.h; }
                img.loading = photoIndex < 2 ? 'eager' : 'lazy';
                setupLightboxTrigger(img, '/photos/' + filename, photo.alt);
                inner.appendChild(img);
                photoIndex++;
            }

            pair.appendChild(inner);
            const pl = document.createElement('div');
            pl.className = 'pair-link';
            pl.textContent = links[photoIndex - 2].word || '·';
            const col = document.createElement('div');
            col.style.cssText = 'width:100%;max-width:min(1100px,100%)';
            pair.replaceChildren(col); col.append(inner, pl);
            enhancedGallery.appendChild(pair);
        } else {
            const photo = photos[photoIndex];
            const filename = photo.f;
            const wrap = document.createElement('div');
            wrap.classList.add('photo-wrap');
            wrap.dataset.index = displayIndex;

            // Vary widths: every 3rd single photo is narrow
            if (displayIndex % 3 === 2) {
                wrap.classList.add('narrow');
            }

            // First item visible immediately
            if (displayIndex === 1) {
                wrap.classList.add('no-fade');
            }

            const img = document.createElement('img');
            img.src = '/photos/' + filename;
            img.alt = photo.alt;
            if (photo.w && photo.h) img.style.aspectRatio = photo.w + '/' + photo.h;
            img.loading = photoIndex < 2 ? 'eager' : 'lazy';
            setupLightboxTrigger(img, '/photos/' + filename, photo.alt);

            wrap.appendChild(img);
            enhancedGallery.appendChild(wrap);
            photoIndex++;
        }
    }

    gallery.replaceChildren(enhancedGallery);

    // Animate only intersecting items, never hide unread/unobserved photographs.
    if ('IntersectionObserver' in window) {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fadeObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                if (!reducedMotion && entry.target.animate) {
                    entry.target.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1500, easing: 'ease' });
                }
                fadeObserver.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.05
    });

    document.querySelectorAll('.photo-wrap:not(.no-fade), .photo-pair').forEach(el => {
        fadeObserver.observe(el);
    });

    // Photo counter — update on scroll
    const counterObserver = new IntersectionObserver((entries) => {
        // Find the most visible photo
        let bestEntry = null;
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                bestEntry = entry;
            }
        });
        if (bestEntry) {
            counter.textContent = bestEntry.target.dataset.index;
        }
    }, {
        threshold: 0.5
    });

    document.querySelectorAll('.photo-wrap, .photo-pair').forEach(el => {
        counterObserver.observe(el);
    });

    }

    // Set initial counter
    counter.textContent = '1';

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let lightboxOpener = null;

    function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
        // Move focus to the close control for keyboard users
        lightboxClose.focus();
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        // Restore focus to the image that opened the lightbox
        if (lightboxOpener && typeof lightboxOpener.focus === 'function') {
            lightboxOpener.focus();
        }
        lightboxOpener = null;
    }

    // Make a gallery image open the lightbox by click or keyboard (Enter/Space)
    function setupLightboxTrigger(img, src, alt) {
        img.tabIndex = 0;
        img.setAttribute('role', 'button');
        const open = () => {
            lightboxOpener = img;
            openLightbox(src, alt);
        };
        img.addEventListener('click', open);
        img.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                open();
            }
        });
    }

    lightbox.addEventListener('click', closeLightbox);
    lightboxClose.addEventListener('click', (e) => {
        e.stopPropagation();
        closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
    });

    // --- Auto-scroll: scroll each photo to center, hold, then continue ---
    (function() {
        // Respect users who prefer reduced motion — don't self-scroll the page
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
        }

        // Auto-scroll on all devices — touch users can still scroll manually

        const allWraps = document.querySelectorAll('.photo-wrap, .photo-pair');
        let currentPhotoIndex = 0;
        let paused = false;
        let manualPaused = false;
        let manualPauseTimer = null;
        let holdTimer = null;
        let stopped = false;
        // Generation token: incremented whenever the scroll chain must be
        // invalidated (manual scroll, resume) so stale loops/timers bail out
        // instead of fighting each other and double-incrementing the index.
        let scrollGen = 0;

        // Visual indicator
        const indicator = document.createElement('div');
        indicator.className = 'auto-scroll-indicator';
        indicator.textContent = 'scrolling';
        document.body.appendChild(indicator);
        indicator.addEventListener('animationend', () => indicator.remove());

        // Pause while the pointer is moving over a picture (desktop) or a finger
        // is on one (mobile). A pointer merely resting on the page is not a
        // pause: each wrap is a full-width block a screen tall, so a still
        // pointer anywhere below the header sits inside one, and the page
        // scrolling under it counts as entering. Only real movement over the
        // picture itself holds the walk, and it lets go after a moment of rest.
        const HOVER_STILL_MS = 1500;
        let hoverTimer = null;
        allWraps.forEach(wrap => {
            wrap.querySelectorAll('img').forEach(img => {
                img.addEventListener('mousemove', (e) => {
                    if (e.movementX === 0 && e.movementY === 0) return; // scroll-induced, not a hand
                    paused = true;
                    clearTimeout(hoverTimer);
                    hoverTimer = setTimeout(() => { paused = false; }, HOVER_STILL_MS);
                });
                img.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); paused = false; });
            });
            wrap.addEventListener('touchstart', () => { paused = true; }, { passive: true });
            wrap.addEventListener('touchend', () => { paused = false; }, { passive: true });
        });

        // Pause on manual scroll — stop auto completely, resume after 10s idle
        function onManualScroll() {
            manualPaused = true;
            // Invalidate any in-flight scroll chain so old loops/timers bail
            scrollGen++;
            clearTimeout(manualPauseTimer);
            clearTimeout(holdTimer);
            manualPauseTimer = setTimeout(() => {
                manualPaused = false;
                // Find which photo is currently centered and resume from there
                let closest = 0;
                let closestDist = Infinity;
                allWraps.forEach((wrap, i) => {
                    const el = wrap.querySelector('.pair-inner') || wrap.querySelector('img') || wrap;
                    const rect = el.getBoundingClientRect();
                    const center = rect.top + rect.height / 2 - window.innerHeight / 2;
                    if (Math.abs(center) < closestDist) {
                        closestDist = Math.abs(center);
                        closest = i;
                    }
                });
                currentPhotoIndex = closest + 1;
                // Fresh generation for the resumed chain
                scrollGen++;
                scrollToPhoto(currentPhotoIndex);
            }, 10000);
        }
        window.addEventListener('wheel', onManualScroll, { passive: true });
        window.addEventListener('touchmove', onManualScroll, { passive: true });

        function scrollToPhoto(index) {
            // Capture the generation for this chain; bail if superseded
            const myGen = scrollGen;
            if (myGen !== scrollGen) return;
            if (index >= allWraps.length || stopped) { stopped = true; return; }
            const wrap = allWraps[index];
            const img = wrap.querySelector('img');
            if (!img) { currentPhotoIndex++; scrollToPhoto(currentPhotoIndex); return; }

            // For pairs, center on the .pair-inner; for singles, center on the img
            const centerEl = wrap.querySelector('.pair-inner') || img;

            function doScroll() {
                if (myGen !== scrollGen) return;
                const imgRect = centerEl.getBoundingClientRect();
                // If image hasn't loaded yet (height 0), wait
                if (imgRect.height < 50 && img.naturalHeight === 0) {
                    img.addEventListener('load', doScroll, { once: true });
                    return;
                }

                const targetY = window.scrollY + imgRect.top - (window.innerHeight - imgRect.height) / 2;
                const startY = window.scrollY;
                const distance = targetY - startY;

                // Skip if already very close
                if (Math.abs(distance) < 10) {
                    holdTimer = setTimeout(() => {
                        if (myGen !== scrollGen) return;
                        if (!stopped) { currentPhotoIndex++; scrollToPhoto(currentPhotoIndex); }
                    }, 4000);
                    return;
                }

                const duration = Math.min(Math.abs(distance) * 8, 8000);
                let elapsed = 0;
                let lastTime = performance.now();

                function animate(now) {
                    if (myGen !== scrollGen) return;
                    if (paused || manualPaused) {
                        lastTime = now; // don't count paused time
                        requestAnimationFrame(animate);
                        return;
                    }
                    elapsed += now - lastTime;
                    lastTime = now;

                    const progress = Math.min(elapsed / duration, 1);
                    const ease = -(Math.cos(Math.PI * progress) - 1) / 2;
                    window.scrollTo(0, startY + distance * ease);

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        holdTimer = setTimeout(() => {
                            if (myGen !== scrollGen) return;
                            if (!stopped) { currentPhotoIndex++; scrollToPhoto(currentPhotoIndex); }
                        }, 4000);
                    }
                }
                requestAnimationFrame(animate);
            }

            doScroll();
        }

        // Start after page settles
        setTimeout(() => {
            scrollToPhoto(0);
        }, 2000);
    })();
    }
    main();
    </script>
</body>
</html>
