<html lang="en">

<title>Study 40</title>
<meta name="description" content="The stone with the six ideas behind the site living in one of its facets: the facet beside the line that says where he is and what the sky is doing, which is what those tools write.">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<style>
/* Study 40: the six ideas (IDEAS in /v2/home.js, read live) and their tools live in the stone, so the home needs no wall.
   Start: 37 ?y=shape as it stands (33's masses, every facet gives a piece of his work), with one facet given over to the tools.
   Kahran, 8 Nov: "the facets have to make sense that have the tools in them. it can't feel random." A logic that needs explaining is the
   wrong logic, and a few clear placements beat six thin ones. So the six share ONE facet, and it is the one beside the where line
   ("We're in New York and it's clear"): that sentence is what the tools write (where I am, the sky, this page's pick), so the names of
   what writes it sit against it. The facet is the nearest one to that line that can hold the six names clear of the poem, the name and
   the caption, and isn't crossed by a door line (those are the poem's). Its basis (the distance, and the next nearest) is kept for the check.
   A name opens its idea in the clear band away from the poem: the idea's words as IDEAS has them, each tool a name that opens its sentence.
   The other facets keep giving his work (37's deal, the wall's sentences taken out of it, since the wall is now this facet).
   Numbers live in defaults.json. */
:root {
  --ink-seam: #0d0c0b; --ink-on: #f3efe6; --ink-on2: #c9c3b6;
  --sans: 'Space Grotesk', -apple-system, sans-serif; --serif: 'Fraunces', Georgia, serif;
  --ease: cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink-seam); color: var(--ink-on); }
a { color: inherit; }
#app { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#stone { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* the poem as read and tapped: the words are drawn on the stone, this layer holds their places */
#read { position: absolute; inset: 0; pointer-events: none; }
.verse { position: absolute; font: 300 18px/1.5 var(--serif); color: transparent; overflow: hidden; pointer-events: auto; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.verse.gone { pointer-events: none !important; }
.verse.scroll { overflow: auto; overscroll-behavior: contain; scrollbar-width: none; }
.verse.scroll::-webkit-scrollbar { display: none; }
.verse h2 { margin: 0 0 .7em; font: italic 400 1.22em/1.25 var(--serif); }
.verse h2 a { text-decoration: none; }
.verse .l { display: block; text-indent: -1em; padding-left: 1em; }
.verse .gap { display: block; height: .7em; }
.verse .door { text-decoration: none; pointer-events: none; outline: none; border-radius: 2px; }
.verse .tag { font: 400 .62em/1 var(--sans); letter-spacing: .1em; margin-left: .7em; white-space: nowrap; }
body[data-at="world"] .verse .l.shown .door { pointer-events: auto; cursor: pointer; }
.verse .door:focus-visible { outline: 1px solid rgba(243,239,230,.7); outline-offset: 3px; }
.verse h2:not(.shown) a { pointer-events: none; }
body[data-at="world"] #app.over { cursor: pointer; }
body[data-at="world"] #app.over .verse .l:not([data-door]) { cursor: pointer; }
#back { position: absolute; z-index: 4; margin: 0; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none;
  font: italic 300 1.0625rem/1.3 var(--serif); color: var(--ink-on); text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 18px rgba(0,0,0,.9); }
#back.on { pointer-events: auto; }
#back a { text-decoration: none; border-bottom: 1px solid rgba(243,239,230,.45); }
#back small { display: block; margin-top: .45em; font: 400 .62em/1.3 var(--sans); font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-on2); }
#back.tight { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; pointer-events: auto; }
#back small.basis { margin-top: .35em; letter-spacing: .06em; text-transform: none; opacity: .72; }
#back small.src a { text-decoration: none; border-bottom: 1px solid rgba(201,195,182,.5); pointer-events: auto; }
#back .say { font-style: normal; }
#back .lines span { display: block; }
#back .lines span + span { margin-top: .15em; }
#idea { position: absolute; z-index: 5; margin: 0; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; white-space: nowrap;
  font: italic 300 clamp(22px, 2.6vw, 36px)/1.2 var(--serif); color: var(--ink-on); text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 26px rgba(0,0,0,.85); }

/* the mat: name, where he is, the way out */
header { position: fixed; z-index: 9; left: clamp(16px, 3.4vw, 56px); bottom: clamp(18px, 5vh, 56px); max-width: 34ch; pointer-events: none; color: #ede7d9; }
header h1 { margin: 0; font: 500 1.15rem/1 var(--sans); letter-spacing: .01em; }
header h1 a { text-decoration: none; pointer-events: auto; }
header p { margin: 10px 0 14px; font: italic 300 1.0625rem/1.4 var(--serif); opacity: .86; }
header p:empty { display: none; }
header nav { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 18px; font: 400 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
header nav a { color: var(--ink-on2); text-decoration: none; transition: color .2s var(--ease); text-shadow: 0 1px 8px rgba(0,0,0,.6); }
header nav a:hover, header nav a:focus-visible { color: #fff; }
.cap { position: fixed; z-index: 9; right: clamp(16px, 3.4vw, 56px); bottom: clamp(18px, 5vh, 56px); margin: 0; font: 400 .7rem/1.5 var(--sans); letter-spacing: .012em; color: var(--ink-on2); text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.vs { position: fixed; top: 10px; right: 10px; z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font: 400 .72rem/1 var(--sans); }
.vs { pointer-events: none; } .vs a { pointer-events: auto; } /* the gaps in the switch belong to the stone beneath */
.vs span { display: flex; gap: 2px; }
.vs a { text-decoration: none; color: var(--ink-on2); padding: 5px 7px; border-radius: 6px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.vs a[aria-current] { color: #ede7d9; background: rgba(127,127,127,.22); }
/* the tools: six names on their facet, and the idea they open */
#names { position: fixed; z-index: 6; display: flex; flex-wrap: wrap; gap: 0 calc(var(--tools-gap-px, 12) * 1px); opacity: 0; pointer-events: none; transition: opacity .5s var(--ease); }
body[data-at="world"] #names.on, body[data-at="stone"] #names.on { opacity: 1; pointer-events: auto; }
#names button, #tools nav button { all: unset; cursor: pointer; font: 400 calc(var(--tools-name-px, 11) * 1px)/2 var(--sans); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
  color: var(--ink-on); text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 1px 12px rgba(0,0,0,.8); }
#names button::before, #tools nav button::before { content: ''; display: inline-block; width: .55em; height: .55em; margin-right: .5em; border-radius: 50%; background: var(--hue, var(--ink-on2)); vertical-align: .08em; }
#names button:hover, #names button:focus-visible { color: #fff; }
#names button:focus-visible, #tools button:focus-visible { outline: 1px solid rgba(243,239,230,.7); outline-offset: 3px; }
#tools { position: fixed; z-index: 8; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; scrollbar-width: none; opacity: 0; pointer-events: none; transition: opacity .3s var(--ease);
  padding: 14px 16px; border-radius: 6px; background: rgba(13,12,11,var(--tools-ground, .82)); color: var(--ink-on); }
#tools::-webkit-scrollbar { display: none; }
#tools.on { opacity: 1; pointer-events: auto; }
#tools nav { display: flex; flex-wrap: wrap; gap: 0 12px; margin-bottom: 8px; }
#tools nav button { color: var(--ink-on2); text-shadow: none; }
#tools nav button[aria-current] { color: var(--ink-on); }
#tools h2 { margin: 4px 0 8px; font: italic 400 1.3rem/1.25 var(--serif); }
#tools h2 a { text-decoration: none; border-bottom: 1px solid rgba(243,239,230,.45); }
#tools p { margin: 0 0 10px; font: 300 .95rem/1.5 var(--serif); }
#tools ul { list-style: none; margin: 0 0 10px; padding: 0; }
#tools li { border-top: 1px solid rgba(243,239,230,.14); }
#tools li button { all: unset; cursor: pointer; display: block; width: 100%; padding: 7px 0; font: 500 .78rem/1.35 var(--sans); letter-spacing: .02em; color: var(--ink-on); }
#tools li button[aria-expanded="false"] { color: var(--ink-on2); }
#tools li p { margin: 0 0 9px; font-size: .9rem; }
#tools li p[hidden] { display: none; }
#tools .boundary { margin: 6px 0 0; font-style: italic; color: var(--ink-on2); }
body.tools-open .cap { opacity: 0; }
@media (max-height: 560px) and (orientation: landscape) {
  header { left: 16px; bottom: 14px; max-width: 42vw; }
  header p { margin: 6px 0 8px; font-size: .9rem; }
  .cap { left: 16px; right: auto; top: 40px; bottom: auto; text-align: left; max-width: 44vw; }
  .vs { flex-direction: row; gap: 8px; top: 6px; }
  .vs a { padding: 4px 5px; }
}
@media (max-width: 640px) and (orientation: portrait) {
  header { left: 16px; right: 16px; bottom: 16px; max-width: none; }
  header p { margin: 6px 0 10px; font-size: .95rem; }
  .cap { left: 16px; right: auto; top: 74px; bottom: auto; text-align: left; max-width: 70%; }
}
</style>

<body>
<div id="app">
  <canvas id="stone" aria-hidden="true"></canvas>
  <div id="read"></div>

  <p id="back" aria-live="polite"></p>
  <header id="mat">

  </header>

</div>

  <span><a href="?t=where" data-t="where">where</a></span>
</nav>
<script src="tune.js"></script>
<script src="today.js"></script>

<script type="module">
addEventListener('unhandledrejection', e => console.error('unhandled: ' + (e.reason && e.reason.stack || e.reason)))
const Q = new URLSearchParams(location.search)
const T = await window.S37T
const num = (k, f) => { const x = parseFloat(T[k]); return Number.isFinite(x) ? x : f }
const VOCABS = ['pairs', 'questions', 'nouns', 'his'], NAMES = ['never', 'crossing', 'door'], YS = ['shape', 'lines', 'mixed', 'whole']
const VOCAB = VOCABS.includes(T['walk-vocab']) ? T['walk-vocab'] : 'his'
const NAME = NAMES.includes(T['walk-name']) ? T['walk-name'] : 'crossing'
const F = 'a', Y = YS.includes(T['yield-way']) ? T['yield-way'] : 'shape' // 37's pick, fixed: the facets that are not the tools give his work by their shape
const TS = ['where'], TW = TS.includes(Q.get('t')) ? Q.get('t') : TS.includes(T['tools-way']) ? T['tools-way'] : 'where' // one way, by Kahran's call of 8 Nov (the home goes live)
const qs = (o = {}) => '?' + new URLSearchParams({ t: TW, ...o }).toString()
document.querySelectorAll('.vs a').forEach(a => { a.href = qs({ t: a.dataset.t }); if (a.dataset.t === TW) a.setAttribute('aria-current', 'true') })
document.body.dataset.t = TW

const $ = s => document.querySelector(s)
const app = $('#app'), cv = $('#stone'), g = cv.getContext('2d'), readEl = $('#read'), mat = $('#mat'), cap = $('#cap'), ideaEl = $('#idea'), backEl = $('#back')
const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const sleep = ms => new Promise(r => setTimeout(r, ms))
let W = 0, H = 0, DPR = 1
const phone = () => W < 640 && H > W * .9 // a phone held upright; a phone on its side is short, see low() (carried from 24, 7 Nov)
const low = () => H < 560 && W > H
function size() { W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR) }
size()
await Promise.race([Promise.all(['300 18px Fraunces', 'italic 400 18px Fraunces', 'italic 300 30px Fraunces', '400 12px "Space Grotesk"'].map(f => document.fonts.load(f))), sleep(3000)]) // the poem is measured and drawn in its own face
const [ctx, DJ, KJ, SEG, REG] = await Promise.all([S14.load($('#where')), fetch('../21/doors.json').then(r => r.json()), fetch('../28/kin.json').then(r => r.json()),
  fetch('../37/segments.json').then(r => r.json()), fetch('../33/regions.json').then(r => r.json()).catch(() => ({ photos: {} }))])
const KIN = KJ.photos
/* the six ideas, read where they live: IDEAS in /v2/home.js (the literal itself, nothing copied), and each one's hue from /v2/home.css */
function literal(src, name) { const at = src.indexOf('var ' + name + ' = '); if (at < 0) throw new Error(name + ' moved'); const s0 = at + name.length + 7
  let depth = 0, q = null; for (let i = s0; i < src.length; i++) { const c = src[i]
    if (q) { if (c === '\\') i++; else if (c === q) q = null; continue } if (c === "'" || c === '"') { q = c; continue }
    if (c === '/' && src[i + 1] === '/') { i = src.indexOf('\n', i); continue } if (c === '[' || c === '{') depth++; else if ((c === ']' || c === '}') && --depth === 0) return new Function('return ' + src.slice(s0, i + 1))() } }
const [homeJs, homeCss] = await Promise.all(['/v2/home.js', '/v2/home.css'].map(u => fetch(u).then(r => r.text())))
const IDEAS = literal(homeJs, 'IDEAS')
const HUE = Object.fromEntries([...homeCss.matchAll(/\.(tile--[a-z]+)\s*\{\s*--h:\s*([\d.]+);\s*--s:\s*([\d.]+)%;\s*--l:\s*([\d.]+)%/g)].map(m => [m[1], `hsl(${m[2]} ${Math.min(70, +m[3] + 20)}% ${Math.min(78, +m[4] + 38)}%)`]))
const VOC = DJ.vocabs[VOCAB], data = ctx.data, stanzasOf = ctx.stanzasOf

/* ---------- small geometry ---------- */
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = Math.imul(s ^ s >>> 15, 2246822507) + 0x9e3779b9 >>> 0, ((s ^ s >>> 13) >>> 0) / 4294967296) }
function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v
const ss = (a, b, t) => clamp01((t - a) / (b - a))
const io = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2
function centroid(p) { let a = 0, x = 0, y = 0; for (let i = 0; i < p.length; i++) { const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length], c = x0 * y1 - x1 * y0; a += c; x += (x0 + x1) * c; y += (y0 + y1) * c } a *= .5; return a ? [x / (6 * a), y / (6 * a)] : p[0] || [0, 0] }
const area2 = P => P.reduce((a, [x0, y0], i) => { const [x1, y1] = P[(i + 1) % P.length]; return a + x0 * y1 - x1 * y0 }, 0)
const bbox = p => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of p) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y } return [x0, y0, x1, y1] }
const meets = (b, [x, y, w, h], pad = 0) => b[2] > x - pad && b[0] < x + w + pad && b[3] > y - pad && b[1] < y + h + pad
const inPoly = ([x, y], p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c } return c }
function clipHalf(P, f) { const o = []
  for (let k = 0; k < P.length; k++) { const a = P[k], b = P[(k + 1) % P.length], fa = f(a), fb = f(b)
    if (fa <= 0) o.push(a)
    if ((fa <= 0) !== (fb <= 0)) { const t = fa / (fa - fb); o.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]) } }
  return o }
const clean = P => P.filter((p, i) => { const q = P[(i + 1) % P.length]; return Math.hypot(p[0] - q[0], p[1] - q[1]) > .05 })
const voronoi = S => S33Cut.voronoi(S, W, H, num('wind', 8)) // 05 B's, from 33's cut.js: the wind draws the facets out
function inset(P, s) { // a true offset of every edge, so the seam is the same width all round
  const n = P.length; if (n < 3 || s <= 0) return P
  const sg = area2(P) > 0 ? 1 : -1, c = centroid(P)
  const L = P.map((a, i) => { const b = P[(i + 1) % n]; let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; return { p: [a[0] - dy * sg * s, a[1] + dx * sg * s], d: [dx, dy] } })
  const Qp = P.map((v, i) => { const A = L[(i - 1 + n) % n], B = L[i], den = A.d[0] * B.d[1] - A.d[1] * B.d[0]
    if (Math.abs(den) < 1e-6) return B.p
    const t = ((B.p[0] - A.p[0]) * B.d[1] - (B.p[1] - A.p[1]) * B.d[0]) / den, q = [A.p[0] + A.d[0] * t, A.p[1] + A.d[1] * t]
    if (Math.hypot(q[0] - v[0], q[1] - v[1]) > s * 5) { const dx = c[0] - v[0], dy = c[1] - v[1], d = Math.hypot(dx, dy) || 1; return [v[0] + dx / d * s * 1.5, v[1] + dy / d * s * 1.5] }
    return q })
  return area2(Qp) * area2(P) > 0 ? Qp : [] }
const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]]
const tr = (x, y) => [1, 0, 0, 1, x, y], sc = (x, y = x) => [x, 0, 0, y, 0, 0]
const about = ([cx, cy], ...ms) => [tr(cx, cy), ...ms, tr(-cx, -cy)].reduce(mul)

/* ---------- the cut: 33's, from the photograph's own regions (cut.js, regions.json); always the same count, so cuts morph cell for cell ---------- */
function cutFor(w, t) { // t only re-seeds where the filling sites fall, never the photograph's lines
  const count = Math.round(phone() ? num('facets-phone', 15) : low() ? num('facets-low', 15) : num('facets-desk', 26))
  const K = S33Cut.cut({ R: REG.photos[w.photo.src] || null, W, H, count, logic: T['cut-way'] || 'masses', wind: num('wind', 8), seed: w.key + (t ? '|' + t : ''), moment: null,
    dials: { share: num('cut-share', .75), gap: num('cut-gap', .03), spacing: num('cut-spacing', .16), fillGap: num('cut-fill-gap', .13), lineMin: num('cut-line-min', .25) } })
  w.cut = K; w.sites = K.sites; const r2 = rng(hash(w.key + '|n' + (t || ''))); w.normals = w.sites.map(() => [(r2() - .5) * .9, (r2() - .5) * .9])
  w.cells = voronoi(w.sites); w.cents = w.cells.map(centroid); w.frags = null; w.plan = null }
function match(A, B) { // B's order so B[out[i]] is A[i]'s partner; the hero keeps the hero
  const n = A.length, out = [0], used = new Set([0]), taken = new Set([0]), pairs = []
  for (let i = 1; i < n; i++) for (let j = 1; j < n; j++) pairs.push([Math.hypot(A[i][0] - B[j][0], A[i][1] - B[j][1]), i, j])
  pairs.sort((p, q) => p[0] - q[0])
  for (const [, i, j] of pairs) { if (used.has(i) || taken.has(j)) continue; out[i] = j; used.add(i); taken.add(j) }
  return out }

/* ---------- the worlds and their doors (the vocabulary chooses both) ---------- */
const poemBy = s => data.poems.find(p => p.slug === s), photoBy = src => data.photos.find(p => p.src === src)
const keyOf = w => w.poem.slug + '~' + w.photo.src.replace('/photos/', '')
const pairOf = key => { const [s, f] = String(key || '').split('~'); const poem = poemBy(s), photo = photoBy('/photos/' + f); return poem && photo ? { poem, photo } : null }
const placedCache = new Map()
function placed(poem) { // the doors a poem can show: one per line, each phrase inside one line as written
  if (placedCache.has(poem.slug)) return placedCache.get(poem.slug)
  const list = VOC.poems[poem.slug] || [], used = new Set(), out = []
  stanzasOf(poem).flat().forEach((line, li) => { const k = list.findIndex((d, k) => !used.has(k) && line.includes(d.phrase)); if (k >= 0) { used.add(k); out.push({ ...list[k], k, line }) } })
  placedCache.set(poem.slug, out); return out }
const good = slug => { const p = poemBy(slug); return !!p && placed(p).length >= 2 } // somewhere with a way on
const wordOf = word => VOC.words.find(x => x.word === word) || { word, concepts: [], poems: [], photos: [] }
function target(from, d, seen, taken) { // the door's idea, carried to a poem and a photograph that hold it and are not behind you
  const Wd = wordOf(d.word), h = hash(from.poem.slug + '|' + d.word + '|' + VOCAB)
  const near = VOC.words.filter(x => x !== Wd && x.concepts.some(c => Wd.concepts.includes(c)))
  const free = s => good(s) && !seen.poems.has(s) && !taken.has(s) && s !== from.poem.slug
